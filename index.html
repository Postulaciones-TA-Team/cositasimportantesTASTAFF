<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Cositas Importantes TA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fija con pestañas; cada pestaña es una herramienta de consulta o un generador, de resumen a detalle */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#1B2033; --muted:#646B85; --line:#E1E4EE;
  --accent:#5552D1; --accent-soft:#ECEBFD; --on-accent:#FFFFFF;
  --client:#23845A; --client-soft:#E3F4EB; --internal:#7A4FC2; --internal-soft:#F0E9FB;
  --crit:#C93C3C; --crit-soft:#FBE9E9; --warn:#B9770E; --warn-soft:#FBF1DE; --ok:#23845A; --ok-soft:#E3F4EB; --done:#7C8299; --done-soft:#EEEFF3;
  --scrim:rgba(20,22,35,.45);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141D; --surface:#1A1D29; --ink:#E8EAF2; --muted:#9CA2B8; --line:#2B2F3F;
  --accent:#9A97F5; --accent-soft:#26254A; --on-accent:#12141D;
  --client:#5CC994; --client-soft:#183126; --internal:#B996F2; --internal-soft:#2C2240;
  --crit:#F07373; --crit-soft:#3A2024; --warn:#E9AE4A; --warn-soft:#3A2F1A; --ok:#5CC994; --ok-soft:#183126; --done:#9298AE; --done-soft:#252836; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141D; --surface:#1A1D29; --ink:#E8EAF2; --muted:#9CA2B8; --line:#2B2F3F;
  --accent:#9A97F5; --accent-soft:#26254A; --on-accent:#12141D;
  --client:#5CC994; --client-soft:#183126; --internal:#B996F2; --internal-soft:#2C2240;
  --crit:#F07373; --crit-soft:#3A2024; --warn:#E9AE4A; --warn-soft:#3A2F1A; --ok:#5CC994; --ok-soft:#183126; --done:#9298AE; --done-soft:#252836; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:14.5px;font-weight:600}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 11px;border-radius:8px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.searchbox{width:190px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}

.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.pagehead .meta{display:flex;flex-direction:column;gap:3px;max-width:680px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-side{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
button.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c,var(--muted));background:var(--cs,var(--done-soft))}
.c-client{--c:var(--client);--cs:var(--client-soft)} .c-int{--c:var(--internal);--cs:var(--internal-soft)}
.c-ok{--c:var(--ok);--cs:var(--ok-soft)} .c-warn{--c:var(--warn);--cs:var(--warn-soft)} .c-crit{--c:var(--crit);--cs:var(--crit-soft)} .c-acc{--c:var(--accent);--cs:var(--accent-soft)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form .full{grid-column:1/-1}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0}
textarea{resize:vertical}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1 1 220px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.note{font-size:12.5px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:9px 12px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.pre{white-space:pre-line}

/* Proceso */
.steps{display:flex;flex-direction:column;gap:0;position:relative}
.step{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:14px}
.step:not(:last-child)::before{content:"";position:absolute;left:21px;top:40px;bottom:0;width:2px;background:var(--line)}
.step .n{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
.step .body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.step .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step .meta div{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flow .arrow{color:var(--muted)}

.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:13px}
/* Acordeones */
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);color:var(--muted);font-size:16px}
details.acc[open]>summary::after{content:"–"}
details.acc[open]{border-color:var(--accent)}
details.acc .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.step .n.sm{width:36px;height:36px;font-size:15px}
.step.compact{grid-template-columns:36px 1fr;padding-bottom:8px}
.step.compact:not(:last-child)::before{left:17px;top:36px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.tile{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile b{font-family:var(--f-display);font-size:16px;font-weight:600;line-height:1.2}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px}
.prot{display:flex;flex-direction:column;gap:8px}
.protrow{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center}
.protbar{height:26px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-family:var(--f-mono);font-size:12px;color:var(--surface);white-space:nowrap;overflow:hidden}
.cflow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.cflow{grid-template-columns:1fr}.protrow{grid-template-columns:1fr}}
/* Status CEIPAL */
.sflow{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.sbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;min-width:0;border-top:4px solid var(--oc)}
.sbtn .sn{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--oc)}
.sbtn .st{font-size:11.5px;line-height:1.25}
.sbtn .ss{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sbtn[aria-pressed="true"]{background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.o-rec{--oc:var(--accent)} .o-poc{--oc:var(--warn)}
.sown{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin-bottom:-4px}
.sown span{border-radius:8px 8px 0 0;padding:5px 8px;font-size:12px;font-weight:600;text-align:center;background:var(--oc);color:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handoff{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.sdetail{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.sname{font-family:var(--f-mono);font-size:17px;font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:inline-block}
.sitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.sit{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.sit:hover{border-color:var(--accent)}
.sit b{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--accent)}
@media (max-width:900px){.sflow{grid-template-columns:repeat(3,minmax(0,1fr))}.sown{display:none}}
/* CEIPAL */
.verdict{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.verdict .big{font-family:var(--f-display);font-size:20px;font-weight:700}
.verdict.ok{background:var(--ok-soft)} .verdict.ok .big{color:var(--ok)}
.verdict.warn{background:var(--warn-soft)} .verdict.warn .big{color:var(--warn)}
.verdict.crit{background:var(--crit-soft)} .verdict.crit .big{color:var(--crit)}
.notechips{display:flex;flex-wrap:wrap;gap:8px}
.notechip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 200px}
.notechip b{font-family:var(--f-mono);font-weight:500;font-size:13px}
.notechip span{font-size:12px;color:var(--muted)}
.notechip:hover{border-color:var(--accent)}

/* Follow up */
.tl{display:flex;flex-direction:column;gap:6px}
.tli{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tli .d{font-family:var(--f-mono);font-size:12.5px;line-height:1.3}
.tli .d small{display:block;color:var(--muted);font-size:11px}
.tli.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tli.past{opacity:.6}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* Follow up pasos */
.fusteps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.fustep{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;min-width:0}
.fustep b{font-family:var(--f-mono);font-size:12px;font-weight:500;white-space:nowrap}
.fustep.past{opacity:.55}
.fustep.now{border-color:var(--warn);background:var(--warn-soft)}
.fustep[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
@media (max-width:700px){.fusteps{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* JD */
.outtabs{display:flex;gap:6px;flex-wrap:wrap}
.out{width:100%;min-height:300px;font-family:var(--f-body);font-size:13.5px;line-height:1.55}
.detected{display:flex;flex-wrap:wrap;gap:6px}

/* Entrevista */
.qlist{display:flex;flex-direction:column;gap:8px}
.qcat{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-top:6px}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;background:var(--surface)}
.q.off{opacity:.45}
.q .qt{font-size:13.5px}
.q .why{font-size:12px;color:var(--muted)}
.q .rate{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q .rate button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 9px;font-size:12px}
.q .rate button[aria-pressed="true"].r3{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.q .rate button[aria-pressed="true"].r2{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.q .rate button[aria-pressed="true"].r1{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.q .rate input{flex:1 1 160px;padding:4px 8px;font-size:12.5px}
.q input[type=checkbox]{width:18px;height:18px;margin-top:2px;padding:0}
.score{display:flex;gap:8px;flex-wrap:wrap}
/* Contratos */
.countries{display:flex;gap:6px;flex-wrap:wrap}
.ccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--bg);border-radius:8px;padding:6px 9px;display:flex;flex-direction:column;font-size:12.5px;min-width:0}
.facts span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ccard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* Salarios */
.split{display:flex;height:42px;border-radius:8px;overflow:hidden}
.split div{display:flex;align-items:center;justify-content:center;color:var(--surface);font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;overflow:hidden;min-width:0}
.bigmoney{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13.5px}
.kv .v{font-family:var(--f-mono);text-align:right}

/* Sites / Links */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{font-weight:600}
.card .s{font-size:12.5px;color:var(--muted)}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}

/* Reloj mundial */
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.clk{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);min-width:0}
.clk .top{display:flex;align-items:center;gap:8px}
.clk .fl{font-size:22px;line-height:1}
.clk .nm{font-weight:600}
.clk .tm{font-family:var(--f-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.clk .df{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.clk .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto}
.clk.home{border-color:var(--accent);background:var(--accent-soft)}
/* Supervisores */
.lvlseg{display:inline-flex;gap:6px;flex-wrap:wrap}
.verdict small{display:block;font-weight:400;color:var(--ink);font-size:13px;margin-top:2px}
.rgtbl td.sel{background:var(--accent-soft);font-weight:600}
.rgtbl tr.cur td:first-child{font-weight:700;color:var(--accent)}
.rgtbl td small{display:block;color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.5;max-width:92%;position:relative}
.bub .who{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.bub.cand{background:var(--bg);border:1px solid var(--line)}
.bub.cand .who{color:var(--muted)}
.bub.rec{background:var(--accent-soft);margin-left:auto}
.bub.rec .who{color:var(--accent)}
.bub.alt{background:var(--warn-soft);margin-left:auto}
.bub.alt .who{color:var(--warn)}
.bub.hl{box-shadow:0 0 0 2px var(--ok)}
.bub.dim{opacity:.5}
.bub .cp{position:absolute;top:6px;right:8px}
.tipline{font-size:12.5px;color:var(--muted);font-style:italic}
.pflow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pstep{border:1px solid var(--line);border-top:4px solid var(--oc);border-radius:10px;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:3px;min-width:0}
.pstep b{font-size:12.5px}.pstep span{font-size:12px;color:var(--muted)}
.pstep .who{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--oc)}
@media (max-width:800px){.pflow{grid-template-columns:1fr}}
/* Mejor hora */
.ctgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px;align-items:baseline}
.ctl .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ctl .co{color:var(--muted);font-size:12.5px}
.status{border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px}
.status.ok{background:var(--ok-soft);color:var(--ok)}.status.wait{background:var(--warn-soft);color:var(--warn)}.status.no{background:var(--crit-soft);color:var(--crit)}
.status small{display:block;font-weight:400;color:var(--ink);font-size:12.5px;margin-top:2px}
.ct{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ct.good{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.ct .clock{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.ct .rate{font-family:var(--f-mono);font-size:13px}
.day24{position:relative;height:14px;background:var(--bg);border-radius:4px;overflow:hidden}
.day24 i{position:absolute;top:0;bottom:0}
.day24 .nw{background:var(--ink);width:2px}
.ticks24{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.ratebar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}.ratebar i{display:block;height:100%;background:var(--ok)}
/* Horarios */
.lanes{display:flex;flex-direction:column;gap:14px}
.lane{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.track{position:relative;height:58px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.blk{position:absolute;top:5px;bottom:5px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--accent);padding:3px 6px;font-size:11.5px;overflow:hidden;line-height:1.25;color:var(--ink)}
.blk.me{background:var(--accent);color:var(--on-accent)}
.blk.now{box-shadow:0 0 0 2px var(--ok)}
.nowline{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--crit)}
.hours{display:grid;grid-template-columns:96px 1fr;gap:10px}
.hours .ticks{position:relative;height:16px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.hours .ticks span{position:absolute;transform:translateX(-50%)}
.nowbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nowbox .panel .big{font-family:var(--f-display);font-size:19px;font-weight:700}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px}}
.mailbox{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;max-height:50vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);border-radius:8px;padding:9px 14px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}

@media (max-width:900px){.grid2,.grid-side{grid-template-columns:1fr}.searchbox{display:none}}
@media (max-width:560px){
  h1{font-size:22px}.brand{display:none}
  .step .meta,.facts{grid-template-columns:1fr}
  .tli{grid-template-columns:78px 1fr}.tli .act{grid-column:1/-1}
  .lane,.hours{grid-template-columns:60px 1fr}
  .nowbox{grid-template-columns:1fr}
}

er contacto con el candidato."}, {"nota": "Interview Scheduled", "uso": "Entrevista programada."}, {"nota": "CV and Video Requested", "uso": "Solicitud de CV y video."}, {"nota": "Final Interview Scheduled", "uso": "Entrevista final programada."}, {"nota": "Hired", "uso": "Candidato contratado."}, {"nota": "In Process", "uso": "Solo puede ser utilizada una vez por reclutador."}], "prot": [{"sit": "Sin notas registradas", "prot": "Disponible para cualquier TA/Sourcer."}, {"sit": "First Contact sin respuesta", "prot": "24 horas de protección."}, {"sit": "Entrevista o Submittal registrado", "prot": "7 días hábiles de protección para el TA Owner."}, {"sit": "Más de una semana sin actualización", "prot": "Disponible nuevamente para otros TA."}, {"sit": "Entrevista agendada", "prot": "48 horas de protección hasta registrar feedback."}]}, "links": [{"name": "Form para solicitar posición", "label": "SOLICITUD REQUISICIÓN", "url": "https://forms.cloud.microsoft/pages/responsepage.aspx?id=I2XspS3VPUS-vO7PE6rnrJ2xCvMQpUhJheD9McMzo0RUMDVPTUxXUk42WFE5RjU4RFBMWFlEUklLOS4u", "desc": "Link para que el Hiring manager solicite formalmente una posicion"}, {"name": "Cambios en form", "label": "Form Changes", "url": "https://forms.cloud.microsoft/pages/responsepage.aspx?id=I2XspS3VPUS-vO7PE6rnrJ6fEcS7VNVAg7je5gIV60pUQ0xEMElINTZWV1Y1QkY5QThOMEJZTzI1RS4u", "desc": "Cancelaciones de posiciones, reopen, etc."}, {"name": "General Talent Acquisition Form", "label": "General Talent Acquisition Form (2026)", "url": "https://forms.office.com/pages/responsepage.aspx?id=I2XspS3VPUS-vO7PE6rnrJ6fEcS7VNVAg7je5gIV60pUOEoxVkE0QTNHTjFGN1A5UlgxTTFTOTczTi4u&route=shorturl", "desc": "Form para proceso invertido, cambios en CO, cancelaciones, rehire y verificacion de extranjeria, company changes"}, {"name": "Ceipal", "label": "Ceipal", "url": "https://talenthirecls1.ceipal.com/Applicants/index", "desc": ""}, {"name": "Salary payment mood Perú", "label": "Compensacion Peru", "url": "https://onesourcecorp.sharepoint.com/:x:/r/sites/CompensationPricing/_layouts/15/Doc2.aspx?action=edit&sourcedoc=%7B2b27af04-c2c3-4140-b07d-87989a05b25d%7D&wdOrigin=TEAMS-MAGLEV.undefined_ns.rwc&wdExp=TEAMS-TREATMENT&wdhostclicktime=1770824590810&web=1", "desc": ""}, {"name": "Control Order", "label": "Control Order", "url": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=I2XspS3VPUS-vO7PE6rnrJ2xCvMQpUhJheD9McMzo0RUNDNEWldTQ0Y5VlVOVFYwMUJJUTlIUDk2Si4u", "desc": ""}, {"name": "Tracker", "label": "", "url": null, "desc": ""}, {"name": "Vista control order", "label": "Vista Control Order para TA.xlsx", "url": "https://onesourcecorp.sharepoint.com/:x:/r/sites/dataentry/Shared%20Documents/Vista%20Control%20Order%20para%20TA.xlsx?d=w340ef4942eb1455c97f682b1bc1dc810&csf=1&web=1&e=BsANOi", "desc": ""}, {"name": "CV Generator", "label": "Solvo CV Generator", "url": "https://teams.microsoft.com/l/app/?source=agentCenterDialog&titleId=T_a686db59-cc62-7eea-77fb-044e68be92ff", "desc": ""}, {"name": "JD CV IA Evaluator", "label": "CV and JD evaluator", "url": "https://teams.microsoft.com/l/app/e14bc513-d061-4a1d-ad75-ea210a6794a9?source=store-item", "desc": ""}, {"name": "Global HR policies", "label": "Global HR policies", "url": "https://teams.microsoft.com/l/app/75efc759-ae1e-40ef-9b5c-2f4efcdd8756?source=store-item", "desc": ""}, {"name": "Kudert", "label": "Kudert", "url": "https://app.kudert.com/send-test?operative=true", "desc": ""}, {"name": "Link de Funnel", "label": "Funnel follow up - STAFF.xlsx", "url": "https://onesourcecorp-my.sharepoint.com/:x:/r/personal/jennifer_botero_solvoglobal_com/_layouts/15/Doc.aspx?sourcedoc=%7B06A78E78-2518-4604-B31A-89273BC3C5A5%7D&file=Funnel%20follow%20up%20-%20STAFF.xlsx&fromShare=true&action=default&mobileredirect=true%20Funnel%20follow%20up%20-%20STAFF.xlsx&ovuser=a5ec6523-d52d-443d-bebc-eecf13aae7ac%2Cvanessa.valencia%40solvoglobal.com&clickparams=eyJBcHBOYW1lIjoiVGVhbXMtRGVza3RvcCIsIkFwcFZlcnNpb24iOiI0OS8yNjA4MTMxOTMyMSJ9", "desc": "Mostrar el movimiento de la posición en números."}, {"name": "Solicitud de CDP", "label": "DataHelpDesk", "url": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=I2XspS3VPUS-vO7PE6rnrMWtLRsqRQpFrxZ3RtV-o1dUN0o0NUc0T1Y3N1pHWk9LNEw1R0I2UTRYSS4u", "desc": "Para cuando las posiciones son Replacement y no está el CDP - se requiere el"}, {"name": "Form de ingreso Relación de dependencia Mexico", "label": "Formulario Nuevo Ingreso", "url": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=I2XspS3VPUS-vO7PE6rnrMWtLRsqRQpFrxZ3RtV-o1dURVJTS0hEQldJR0VVVFVPRDZLQk9MWlFFUC4u", "desc": ""}], "fu_obj": ["Optimizar y estandarizar la comunicación entre los actores del proceso de reclutamiento enfocado en nuestros clientes (TA, Ventas y Onboarding) para colocar hires de la forma más rápida y eficiente posible. Una comunicación efectiva asegura que el cliente responda y que los candidatos sean considerados y entrevistados a tiempo, reduciendo los ciclos de desconexión, demoras y seguimientos.\nLos clientes nuevos son muy importantes: activarlos y hacerlos crecer es parte de nuestro objetivo como Talent Acquisition. Trabajar junto con Onboarding permite movilizar y garantizar estos hires, dejando a Ventas enfocado en sus funciones. La relación y el enfoque correctos del POC de TA y del agente de OB con el cliente serán el camino hacia el éxito de los clientes nuevos y el crecimiento orgánico.", "1. Cronograma general (resumen)"], "fu_notes": [{"n": "1", "tema": "Respuestas del cliente", "regla": "Si el cliente responde a nuestros correos, debe ser un feedback concreto sobre los candidatos presentados. Respuestas como \"estamos revisando\", \"gracias, lo reviso\", \"quedamos atentos\", \"les escribimos pronto\" cuentan como respuesta, pero no como la que necesitamos para saber si el pipeline avanza. En esos casos NO se inicia el proceso de follow up: el Especialista de Activación de Clientes llama ese mismo día al Implementation Manager para darle visibilidad de las respuestas y al día siguiente llama al cliente para hacer seguimiento a los próximos pasos con base en los primeros candidatos enviados."}, {"n": "2", "tema": "Canales y responsable", "regla": "Todas las comunicaciones de seguimiento las envía TA, a través del Especialista de Activación de Clientes a cargo del cliente, en este orden: 1) llamada; 2) si no contesta, correo; 3) finalmente, un SMS con el resumen del último correo enviado."}, {"n": "3", "tema": "Frecuencia y duración", "regla": "Cada contacto se hace como muestra el calendario: unos cada 48 horas y otros cada 72 horas. Desde el envío del 1.er candidato, todo el proceso de follow up y el aviso final de cancelación de la requisición toma 22 días hábiles."}, {"n": "4", "tema": "Candidatos mínimos para iniciar", "regla": "Los reclutadores deben enviar 3 candidatos por posición (si el cliente solicita 2 o más vacantes) y máximo 5 candidatos por posición (si solicita solo 1 vacante) para iniciar el proceso de follow up."}, {"n": "5", "tema": "Cliente de vacaciones / PTO / fuera de oficina", "regla": "El contador de seguimientos se detiene. De acuerdo con Ventas y el Implementation Manager se toma una de estas rutas: 1) intentar contactar a un segundo punto de contacto de respaldo que indique el contacto principal; 2) si no hay respaldo, poner la posición en hold hasta que el cliente regrese. La reactivación es responsabilidad del Especialista de Activación de Clientes."}, {"n": "6", "tema": "Tiempo de respuesta de TA", "regla": "El equipo de TA se compromete a responder al cliente en máximo 3 horas hábiles: agendamiento de entrevistas de candidatos, preguntas y feedback en general."}, {"n": "7", "tema": "Límite de 5 candidatos", "regla": "Si ya se enviaron 5 candidatos al cliente y este no responde, sin importar en qué número de seguimiento estemos, se dejan de enviar candidatos nuevos hasta recibir feedback de los pendientes."}], "fu_tpls": [{"n": "1", "seg": "Seguimiento 1", "asunto": "Seguimiento a candidatos para el cargo de [Nombre del cargo]", "cuerpo": "Buenos días, [Nombre del cliente]:\n\nEspero que se encuentre muy bien.\n\nLe escribo para hacer seguimiento a la shortlist de candidatos que le compartí el [Fecha de envío] para el cargo de [Nombre del cargo] en [Empresa]. Le dejo un resumen para su referencia:\n• [Nombre del candidato 1]\n• [Nombre del candidato 2]\n• [Nombre del candidato 3]\n\nLos tres candidatos siguen muy interesados en la oportunidad y con ganas de avanzar en el proceso. Me han pedido novedades, por eso quería consultarle si tiene algún feedback inicial o si le gustaría programar entrevistas con alguno de ellos.\n\nQuedo pendiente de sus comentarios o de cualquier información adicional que necesite de mi parte.\n\nCordial saludo,\n[Su nombre]"}, {"n": "2", "seg": "Seguimiento 2", "asunto": "Segundo seguimiento a candidatos para el cargo de [Nombre del cargo]", "cuerpo": "Buenos días, [Nombre del cliente]:\n\nEspero que se encuentre muy bien.\n\nQuiero hacer un nuevo seguimiento a la shortlist de candidatos que le compartí el [Fecha de envío] para el cargo de [Nombre del cargo] en [Empresa]. Como recordatorio, los candidatos presentados fueron:\n• [Nombre del candidato 1]\n• [Nombre del candidato 2]\n• [Nombre del candidato 3]\n\nYa ha pasado poco más de una semana y los tres candidatos siguen muy interesados en la oportunidad. Me han vuelto a escribir para preguntar por los siguientes pasos, así que quería consultarle si tiene algún feedback o si desea avanzar con las entrevistas.\n\nPor favor, cuénteme cómo desea proceder o si necesita información adicional de mi parte. Con gusto le colaboro en lo que necesite.\n\nCordial saludo,\n[Su nombre]"}, {"n": "3", "seg": "Seguimiento 3", "asunto": "Tercer seguimiento a candidatos para el cargo de [Nombre del cargo]", "cuerpo": "Buenos días, [Nombre del cliente]:\n\nEspero que se encuentre muy bien.\n\nLe escribo nuevamente por la shortlist de candidatos que compartimos el [Fecha de envío] para el cargo de [Nombre d       <section class="panel"><h2>Protección del candidato</h2>
        <div class="prot">${C.prot.map(p=>{const h=PROT_H[norm(p.sit)]??0;const lbl=h===0?'Libre':h>=168?'7 días hábiles':h+' horas';const w=h===0?18:Math.min(100,18+h/168*82);
          return `<div class="protrow"><span title="${esc(p.prot)}">${esc(p.sit)}</span><span class="protbar" style="width:${w}%;background:${h?'var(--warn)':'var(--ok)'}">${lbl}</span></div>`}).join('')}</div></section>

function ceipalCheck(){
  const out=$('ckOut');if(!out)return;
  const e=$('ckExists').value,a=$('ckActive').value,l=$('ckLast').value;
  const showDate=e==='si'&&a==='no'&&!['none','hired'].includes(l);
  $('ckDate').parentElement.hidden=!showDate;$('ckTime').parentElement.hidden=!showDate;
  $('ckActive').parentElement.hidden=e==='no';$('ckLast').parentElement.hidden=e==='no';
  let cls='ok',big='Disponible',txt='';
  if(e==='no'){big='Créalo en CEIPAL';txt='No existe: crea el perfil completo y déjalo documentado con una nota de seguimiento.'}
  else if(a==='si'){cls='crit';big='No continuar';txt='Tiene un proceso o submittal activo. No se puede continuar con el candidato.'}
  else if(l==='none'){txt='Sin notas registradas: está disponible para cualquier TA o sourcer.'}
  else if(l==='hired'){cls='crit';big='Ya fue contratado';txt='Tiene la nota Hired.'}
  else{
    const at=new Date(($('ckDate').value||iso(new Date()))+'T'+($('ckTime').value||'09:00'));
    let until,why;
    if(l==='fc'){until=new Date(at.getTime()+24*3600e3);why='First Contact sin respuesta: 24 horas de protección.'}
    else if(l==='int'){until=new Date(at.getTime()+48*3600e3);why='Entrevista agendada: 48 horas de protección hasta registrar feedback.'}
    else if(l==='sub'){until=addBiz(at,7);why='Entrevista o submittal registrado: 7 días hábiles de protección para el TA owner.'}
    else{until=new Date(at.getTime()+7*24*3600e3);why='Más de una semana sin actualización vuelve a quedar disponible.'}
    const now=new Date();
    if(now<until){cls='warn';big='Protegido';txt=`${why} Libre desde el ${until.toLocaleString('es-CO',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}.`}
    else txt=`${why} Ese plazo ya venció.`;
  }
  out.innerHTML=`<div class="verdict ${cls}"><span class="big">${big}</span><span>${esc(txt)}</span></div>`;
}

const BUL=/^\s*(?:[•\-*·▪●◦■□➤►▶✓✔→–—]|\d{1,2}[.)]|[a-z][.)])\s+/i;

const KV=[['title',/^(job title|position title|position|title|role|job|vacancy|cargo|puesto|posici[oó]n|vacante|nombre del cargo)$/],['loc',/^(location|work location|job location|city|country|countries|ubicaci[oó]n|ciudad|pa[ií]s(es)?|sede)$/],

    const item=sec==='sum'?line.replace(BUL,''):line.replace(BUL,'').replace(/\.\s*$/,'').slice(0,220);

  if(!r.title){const m=all.match(/^(?:[Jj]ob [Dd]escription|JD)\s*[-–|]\s*((?:[A-ZÁÉÍÓÚ][\w&/áéíóúñ]*\s?){1,5})/);if(m)r.title=m[1].trim()}

  if(!r.mod){if(/\bremot[eo]\b|work from home|wfh|teletrabajo|home office/i.test(all))r.mod=/h[ií]brid/i.test(all)?'Híbrido':'Remoto';

function peSplit(total,mod,rmv){
  const T=mod==='h'?200:(+mod)*4*30, R=total-T;
  let base,food;
  const x=R/1.2,f=R-R/1.2;
  if(x<rmv)base=rmv;else if(R*0.2>2*rmv)base=null;else base=x;
  if(f>2*rmv)food=2*rmv;else if(f<rmv)food=null;else food=f;
  if(base==null)base=total-food-T;
  base=Math.ceil(base-1e-9);
  if(food==null)food=total-base-T;
  food=Math.floor(food+1e-9);
  return {T,base,food,R};
}

const CT=[
  {p:'Colombia',tz:'America/Bogota',best:[[600,840]],avoid:[[480,540],[1200,1440]],rate:'62–65%',r:63.5,tip:'Pico cerca de la 1:00 p. m.',bt:'10:00 a. m. – 2:00 p. m.',at:'8:00–9:00 a. m. y después de las 8:00 p. m.'},
  {p:'Kenia',tz:'Africa/Nairobi',best:[[480,600]],avoid:[[900,1200]],rate:'88–99%',r:93.5,bt:'8:00 – 10:00 a. m.',at:'Desde las 3:00 p. m. (hasta las 8:00 p. m.)'},
  {p:'Argentina',tz:'America/Argentina/Buenos_Aires',best:[[720,1140]],avoid:[[1200,1440],[0,240]],rate:'93%',r:93,bt:'12:00 – 7:00 p. m.',at:'8:00 p. m. – 4:00 a. m.'},
  {p:'México',tz:'America/Mexico_City',best:[[660,780]],avoid:[[840,900]],rate:'47%',r:47,tip:'2:00 p. m. es su hora de comida',bt:'11:00 a. m. – 1:00 p. m.',at:'2:00 p. m. (hora de comida)'},
  {p:'Perú',tz:'America/Lima',best:[[720,840],[1080,1140]],avoid:[],rate:'77–84%',r:80.5,bt:'12:00 – 2:00 p. m. y 6:00 p. m.',at:''}];
const tzMin=tz=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());return (+p.find(x=>x.type==='hour').value%24)*60+(+p.find(x=>x.type==='minute').value)};
const inR=(m,rs)=>rs.some(([a,b])=>m>=a&&m<b);
const FLAG={'Colombia':'🇨🇴','Kenia':'🇰🇪','Argentina':'🇦🇷','México':'🇲🇽','Perú':'🇵🇪'};
V.contactar=()=>`<div class="pagehead"><div class="meta"><span class="eyebrow">Según respuestas por WhatsApp</span><h1>¿Es buena hora para escribirle al candidato?</h1></div><span class="muted small">Se actualiza sola</span></div>
  <div class="ctgrid" id="ctGrid"></div>
  <p class="muted small">Entre paréntesis: la misma hora en Colombia. Estimaciones con datos de respuesta de WhatsApp en Solvo Global.</p>`;
function renderCT(){
  if(!$('ctGrid'))return;
  const co=tzMin('America/Bogota');
  const rows=CT.map(c=>{const m=tzMin(c.tz);let off=m-co;if(off>720)off-=1440;if(off<-720)off+=1440;
    const good=inR(m,c.best),bad=inR(m,c.avoid);
    const nb=c.best.map(([a])=>a).sort((x,y)=>((x-m+1440)%1440)-((y-m+1440)%1440))[0],wait=(nb-m+1440)%1440;
    const cur=c.best.find(([a,b])=>m>=a&&m<b);
    const toCo=x=>hm(((x-off)%1440+1440)%1440);
    const rng=rs=>rs.map(([a,b])=>`${hm(a)} – ${hm(b)}`).join(' y ');
    const rngCo=rs=>rs.map(([a,b])=>`${toCo(a)} – ${toCo(b)}`).join(' y ');
    const w=`${wait>=60?Math.floor(wait/60)+' h':''}${wait%60?' '+wait%60+' min':''}`.trim();
    const st=good?['ok','✅ Sí, buen momento para escribir',`Quedan ${(()=>{const r=cur[1]-m;return `${r>=60?Math.floor(r/60)+' h ':''}${r%60?r%60+' min':''}`.trim()})()} de la mejor franja`]
      :bad?['no','⛔ Mejor no escribir ahora',`La mejor hora empieza en ${w} (${toCo(nb)} en Colombia)`]
      :['wait','⏳ Espera un poco',`La mejor hora empieza en ${w} (${toCo(nb)} en Colombia)`];
    return {c,m,off,good,st,html:`<article class="ct ${good?'good':''}"><div class="panel-head"><h2>${FLAG[c.p]||''} ${c.p}</h2><span class="muted small num">allá son las <b style="color:var(--ink)">${hm(m)}</b>${off?` · ${off>0?'+':''}${off/60} h`:''}</span></div>
      <div class="status ${st[0]}">${st[1]}<small>${st[2]}</small></div>
      <div class="ctl"><span class="k">Mejor hora</span><span>${rng(c.best)}${off?` <span class="co">(${rngCo(c.best)})</span>`:''}</span>
        ${c.avoid.length?`<span class="k">Evitar</span><span>${esc(c.at)}${c.tip&&/comida/.test(c.tip)?'':''}</span>`:''}
        ${c.tip?`<span class="k">Tip</span><span>${esc(c.tip)}</span>`:''}
        <span class="k">Responden</span><span><b>${c.rate}</b> de los candidatos</span></div>
    </article>`}});
  rows.sort((a,b)=>(b.good-a.good)||(a.st[0]==='no')-(b.st[0]==='no'));
  $('ctGrid').innerHTML=rows.map(r=>r.html).join('');
}

/* ================== Búsqueda global ================== */
function globalSearch(q){
  const n=norm(q),R=[];if(!n)return R;
  const add=(tab,title,sub)=>R.push({tab,title,sub});
  DATA.proceso.forEach(s=>{if(norm(s.etapa+s.desc+s.tool+s.sla).includes(n))add('proceso',s.etapa,s.sla)});
  ST.forEach(x=>{if(norm(x.s+x.d+x.who).includes(n))add('status',x.n+'. '+x.s,x.who+' · '+x.sla)});
  NOSIGUE.concat(PAUSA).forEach(([es,en])=>{if(norm(es+en).includes(n))add('status',en,es)});
  SUPQ.forEach(([q,a])=>{if(norm(q+a).includes(n))add('sups',q,a.slice(0,80))});if(norm('supervisor salario script expectativa bonos rango').includes(n)||n.includes('supervisor'))add('sups','Salario y script de Supervisores','Rangos JR, SP y SR por país');
  DATA.ceipal.notas.forEach(s=>{if(norm(s.nota+s.uso).includes(n))add('ceipal',s.nota,s.uso)});
  DATA.ceipal.prot.forEach(s=>{if(norm(s.sit+s.prot).includes(n))add('ceipal',s.sit,s.prot)});
  DATA.fu_notes.forEach(s=>{if(norm(s.tema+s.regla).includes(n))add('followup',s.tema,s.regla.slice(0,90)+'…')});
  DATA.contratos.forEach(s=>{if(norm(s.pais+s.tipo+s.cond+s.benef+s.notas+s.partner).includes(n))add('contratos',s.pais+' · '+s.tipo,s.partner)});
  DATA.sites.forEach(s=>{if(norm(s.site+s.ciudad+s.dir+s.pais).includes(n))add('sites',s.site,[s.ciudad,s.pais].filter(Boolean).join(', '))});
  DATA.links.forEach(s=>{if(norm(s.name+s.desc+s.label).includes(n))add('links',s.name,s.desc)});
  DATA.horarios.forEach(s=>{if(norm(s.ta).includes(n))add('horarios',s.ta,`Usuario ${s.cuenta} · ${hm(s.ini)}–${hm(s.fin)}`)});
  return R.slice(0,30);
}

  const il=e.target.closest('[data-ivlang]');if(il){IV.lang=il.dataset.ivlang;IVAI=null;for(const k in IVST)delete IVST[k];store.set('iv',IV);go('entrevista');return}
  const iw=e.target.closest('[data-ivview]');if(iw){IV.view=iw.dataset.ivview;store.set('iv',IV);document.querySelectorAll('[data-ivview]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ivview===IV.view));renderIV();return}
  const ir=e.target.closest('[data-ivr]');if(ir){const [id,v]=ir.dataset.ivr.split(':');IVST[id]=IVST[id]||{};IVST[id].r=IVST[id].r===+v?0:+v;renderIV();return}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id.startsWith('ck')){CK.exists=$('ckExists').value;CK.active=$('ckActive').value;CK.last=$('ckLast').value;CK.date=$('ckDate').value;CK.time=$('ckTime').value;ceipalCheck();return}
  if(id==='fuSubj'||id==='fuBody'){updMail();return}
  if(id.startsWith('fu')){const k={fuDate:'date',fuCliente:'cliente',fuEmpresa:'empresa',fuCargo:'cargo',fuCands:'cands',fuYo:'yo',fuTo:'to'}[id];if(k){FU[k]=e.target.value;store.set('fu',FU);if(k==='date')FUSEL=null;renderFU()}return}
  if(id==='ivJd'){JD.text=e.target.value;IVAI=null;for(const x in AIOUT)delete AIOUT[x];store.set('jd',JD);clearTimeout(renderIV._t);renderIV._t=setTimeout(renderIV,250);return}
  if(id==='ivCand'){IV.cand=e.target.value;store.set('iv',IV);return}
  if(id.startsWith('ivn_')){const q=id.slice(4);IVST[q]=IVST[q]||{};IVST[q].n=e.target.value;return}
  if(e.target.dataset&&e.target.dataset.ivon){const q=e.target.dataset.ivon;IVST[q]=IVST[q]||{};IVST[q].off=!e.target.checked;e.target.closest('.q').classList.toggle('off',!e.target.checked);return}
  if(id.startsWith('jd')&&id!=='jdOut'){const k={jdText:'text',jdTitle:'title',jdLoc:'loc',jdMod:'mod',jdSched:'sched',jdEng:'eng',jdSal:'sal',jdLink:'link',jdYo:'yo',jdOSum:'o_sum',jdOResp:'o_resp',jdOReqs:'o_reqs',jdOBen:'o_ben'}[id];if(k){JD[k]=e.target.value;for(const x in AIOUT)delete AIOUT[x];store.set('jd',JD);renderJD()}return}
  if(id==='stAt'){STCK.at=e.target.value;renderST();$('stAt')&&$('stAt').focus();return}
  if(id==='supExp'){const d=e.target.value.replace(/[^\d]/g,'');SUP.exp=d?new Intl.NumberFormat('es-CO').format(+d):'';store.set('sup',SUP);const pos=e.target.value.length;renderSup();return}
  if(id==='peTotal'||id==='peRange'||id==='peRmv'){if(id==='peRange')$('peTotal').value=e.target.value;if(id==='peTotal')$('peRange').value=e.target.value;PE.total=+$('peTotal').value;PE.rmv=+$('peRmv').value||1130;store.set('pe',PE);renderPE();return}
  if(id==='salPais'||id==='salTotal'){SAL.pais=$('salPais').value;SAL.total=$('salTotal').value;store.set('sal',SAL);renderSal();return}
  if(id==='sQ'||id==='sPais'||id==='sComp'||id==='sOff'){SF.q=$('sQ').value;SF.pais=$('sPais').value;SF.comp=$('sComp').value;SF.showOff=$('sOff').checked;renderSites();return}
  if(id==='lQ'){LQ=e.target.value;renderLinks();return}
  if(id==='hMe'){if(ME!==e.target.value){ME=e.target.value;store.set('me',ME);go('horarios')}return}
});
document.addEventListener('change',e=>{if(['ckExists','ckActive','ckLast','jdMod','salPais','sPais','sComp','sOff','hMe'].includes(e.target.id))e.target.dispatchEvent(new Event('input',{bubbles:true}))});

const h0=location.hash.slice(1);
go(V[h0]?h0:(V[store.get('tab','proceso')]?store.get('tab','proceso'):'proceso'));
(async()=>{try{if(window.claude&&window.claude.use){SAMPLE=await window.claude.use('sample');if(VIEW==='jd'&&$('jdAI'))$('jdAI').hidden=!SAMPLE}}catch(e){}})();
</script>
