/* ================== Búsqueda global ================== */
function globalSearch(q){
  const n=norm(q),R=[];if(!n)return R;
  const add=(tab,title,sub)=>R.push({tab,title,sub});
  DATA.proceso.forEach(s=>{if(norm(s.etapa+s.desc+s.tool+s.sla).includes(n))add('proceso',s.etapa,s.sla)});
  ST.forEach(x=>{if(norm(x.s+x.d+x.who).includes(n))add('status',x.n+'. '+x.s,x.who+' · '+x.sla)});
  (DATA.novedades||[]).forEach(x=>{if(norm(x.titulo+x.texto+(x.autor||'')).includes(n))add('novedades',x.titulo,x.fecha)});
  OBJ.forEach(x=>{if(norm(x.q+x.es+x.cat).includes(n))add('objeciones',x.q,x.cat)});
  TPL.forEach(x=>{if(norm(x.n+x.d).includes(n))add('plantillas',x.n,x.d)});
  if(norm('fecha de ingreso start date calculadora').includes(n))add('ingreso','Calculadora de fecha de ingreso','Días mínimos y cortes por país');
  PAGOS.forEach(x=>{if(norm(x.pais+x.resp+x.tipo+x.pago+' pago metodo banco').includes(n))add('pagos',x.pais+' · '+x.resp,x.tipo+' · '+x.pago)});
  SLA_PH.forEach(([t,h,x])=>{if(norm(t+(x||'')+' sla prehiring').includes(n))add('sla',t,h+' horas hábiles')});
  NOSIGUE.concat(PAUSA).forEach(([es,en])=>{if(norm(es+en).includes(n))add('status',en,es)});
  SUPQ.forEach(([q,a])=>{if(norm(q+a).includes(n))add('sups',q,a.slice(0,80))});if(norm('supervisor salario script expectativa bonos rango').includes(n)||n.includes('supervisor'))add('sups','Salario y script de Supervisores','Rangos JR, SP y SR por país');
  DATA.ceipal.notas.forEach(s=>{if(norm(s.nota+s.uso).includes(n))add('ceipal',s.nota,s.uso)});
  DATA.ceipal.prot.forEach(s=>{if(norm(s.sit+s.prot).includes(n))add('ceipal',s.sit,s.prot)});
  DATA.fu_notes.forEach(s=>{if(norm(s.tema+s.regla).includes(n))add('followup',s.tema,s.regla.slice(0,90)+'…')});
  DATA.contratos.forEach(s=>{if(norm(s.pais+s.tipo+s.cond+s.benef+s.notas+s.partner).includes(n))add('contratos',s.pais+' · '+s.tipo,s.partner)});
  DATA.sites.forEach(s=>{if(norm(s.site+s.ciudad+s.dir+s.pais).includes(n))add('sites',s.site,[s.ciudad,s.pais].filter(Boolean).join(', '))});
  DATA.links.forEach(s=>{if(norm(s.name+s.desc+s.label).includes(n))add('links',s.name,s.desc)});
  DATA.horarios.forEach(s=>{if(norm(s.ta).includes(n))add('horarios',s.ta,`Usuario ${s.cuenta} · ${hm(s.ini)}–${hm(s.fin)}`)});
  return R.slice(0,30);
}

function go(k){

  $('main').innerHTML=V[k]();

  store.set('tab',k);window.scrollTo(0,0);

}

  const se=e.target.closest('[data-supesq]');if(se){SUP.esq=se.dataset.supesq;store.set('sup',SUP);go('sups');return}

document.addEventListener('input',e=>{
  if(['inPais','inTipo','inFecha','inExtra'].includes(e.target.id)){ING[e.target.id.slice(2).toLowerCase()]=e.target.value;if(e.target.id==='inPais')ING.tipo='';store.set('ing',{pais:ING.pais,tipo:ING.tipo,extra:ING.extra});renderING();return}
  if(e.target.closest('#tplForm')){TP.f[e.target.name]=e.target.value;store.set('tpl',TP);tplOut();return}
  if(e.target.id==='slaAt'){SLA.at=e.target.value;slaCalc();return}
  if(e.target.id==='slaIni'||e.target.id==='slaFin'){SLA[e.target.id==='slaIni'?'ini':'fin']=e.target.value;store.set(e.target.id==='slaIni'?'slaini':'slafin',e.target.value);slaCalc();return}
  const id=e.target.id;
  if(id.startsWith('ck')){CK.exists=$('ckExists').value;CK.active=$('ckActive').value;CK.last=$('ckLast').value;CK.date=$('ckDate').value;CK.time=$('ckTime').value;ceipalCheck();return}
  if(id==='fuSubj'||id==='fuBody'){updMail();return}
  if(id.startsWith('fu')){const k={fuDate:'date',fuCliente:'cliente',fuEmpresa:'empresa',fuCargo:'cargo',fuCands:'cands',fuYo:'yo',fuTo:'to'}[id];if(k){FU[k]=e.target.value;store.set('fu',FU);if(k==='date')FUSEL=null;renderFU()}return}
  if(id==='ivJd'){JD.text=e.target.value;IVAI=null;for(const x in AIOUT)delete AIOUT[x];store.set('jd',JD);clearTimeout(renderIV._t);renderIV._t=setTimeout(renderIV,250);return}
  if(id==='ivCand'){IV.cand=e.target.value;store.set('iv',IV);return}
  if(id.startsWith('ivn_')){const q=id.slice(4);IVST[q]=IVST[q]||{};IVST[q].n=e.target.value;return}
  if(e.target.dataset&&e.target.dataset.ivon){const q=e.target.dataset.ivon;IVST[q]=IVST[q]||{};IVST[q].off=!e.target.checked;e.target.closest('.q').classList.toggle('off',!e.target.checked);return}
  if(id.startsWith('jd')&&id!=='jdOut'){const k={jdText:'text',jdTitle:'title',jdLoc:'loc',jdMod:'mod',jdSched:'sched',jdEng:'eng',jdSal:'sal',jdLink:'link',jdYo:'yo',jdOSum:'o_sum',jdOResp:'o_resp',jdOReqs:'o_reqs',jdOBen:'o_ben'}[id];if(k){JD[k]=e.target.value;for(const x in AIOUT)delete AIOUT[x];store.set('jd',JD);renderJD()}return}
  if(id==='stAt'){STCK.at=e.target.value;renderST();$('stAt')&&$('stAt').focus();return}
  if(id==='supExp'){const d=e.target.value.replace(/[^\d]/g,'');SUP.exp=d?new Intl.NumberFormat(LOC()).format(+d):'';store.set('sup',SUP);const pos=e.target.value.length;renderSup();return}
  if(id==='peTotal'||id==='peRange'||id==='peRmv'){if(id==='peRange')$('peTotal').value=e.target.value;if(id==='peTotal')$('peRange').value=e.target.value;PE.total=+$('peTotal').value;PE.rmv=+$('peRmv').value||1130;store.set('pe',PE);renderPE();return}
  if(id==='salPais'||id==='salTotal'){SAL.pais=$('salPais').value;SAL.total=$('salTotal').value;store.set('sal',SAL);renderSal();return}
  if(id==='sQ'||id==='sPais'||id==='sComp'||id==='sOff'){SF.q=$('sQ').value;SF.pais=$('sPais').value;SF.comp=$('sComp').value;SF.showOff=$('sOff').checked;renderSites();return}
  if(id==='lQ'){LQ=e.target.value;renderLinks();return}
  if(id==='hMe'){if(ME!==e.target.value){ME=e.target.value;store.set('me',ME);go('horarios')}return}
});
