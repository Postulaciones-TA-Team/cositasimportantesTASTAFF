function renderHor(){
  if(!$('hLanes'))return;
  const now=bogotaMin(),S0=300,S1=1080,pct=m=>(m-S0)/(S1-S0)*100;
  const first=n=>n.split(' ')[0];
  $('hNow').innerHTML=['Mari','Vane'].map(c=>{const cur=DATA.horarios.find(h=>h.cuenta===c&&now>=h.ini&&now<h.fin);const nx=DATA.horarios.filter(h=>h.cuenta===c&&h.ini>now).sort((a,b)=>a.ini-b.ini)[0];
    return `<div class="panel"><span class="eyebrow">Usuario ${c} · ahora (${hm(now)})</span><span class="big">${cur?esc(cur.ta):'Libre'}</span><span class="muted small">${cur?`hasta las ${hm(cur.fin)}`:''}${nx?`${cur?' · ':''}Sigue: ${esc(first(nx.ta))} a las ${hm(nx.ini)}`:''}</span></div>`}).join('');
  const ticks=[];for(let m=S0;m<=S1;m+=60)ticks.push(m);
  $('hLanes').innerHTML=`<div class="hours"><span></span><div class="ticks">${ticks.map(m=>`<span style="left:${pct(m)}%">${hm(m)}</span>`).join('')}</div></div>`+
    ['Mari','Vane'].map(c=>`<div class="lane"><b>Usuario ${c}</b><div class="track">${DATA.horarios.filter(h=>h.cuenta===c).map(h=>`<div class="blk ${h.ta===ME?'me':''} ${now>=h.ini&&now<h.fin?'now':''}" style="left:${pct(h.ini)}%;width:${pct(h.fin)-pct(h.ini)}%" title="${esc(h.ta)} · ${hm(h.ini)}–${hm(h.fin)}">${esc(first(h.ta))}<br><span class="num">${hm(h.ini)}</span></div>`).join('')}
    ${now>=S0&&now<=S1?`<div class="nowline" style="left:${pct(now)}%"></div>`:''}</div></div>`).join('');
}

function qaLoad(id){QAD.cur=id;const r=qaCur();QA_KEYS.forEach(k=>{QA[k]=qaClone(r&&r[k]!=null?r[k]:QA_EMPTY[k])});QA_SC=null}

function qaPersist(now){const r=qaCur();if(r){QA_KEYS.forEach(k=>r[k]=qaClone(QA[k]));r.updated=Date.now()}

  clearTimeout(QA_PT);if(now)doIt();else QA_PT=setTimeout(doIt,150)}

  try{return fn()}finally{QA_KEYS.forEach(k=>QA[k]=keep[k]);QAD.cur=kc;QA_SC=null}}

/* --- Pasos del proceso --- */

  ['send','Submittal enviado con ubicación, tipo de trabajo, salario acordado y video','Revisa que no tenga errores antes de mandarlo al manager.','c',0,['Q013','Q028'],true,'st'],

 cli:[

  ['ats_cli','Estado del candidato actualizado en CEIPAL','','c',0,['Q026'],true,'st']],
 con:[

  ['oferta','Le confirmé por escrito salario, tipo de contrato, frecuencia de pago y fecha de inicio','Deja el pantallazo o el correo en CEIPAL.','c',0,['Q001','Q020','Q005'],true,'st'],
  ['inicio_f','Fecha de inicio','','d',0,[],true,'st'],
  ['co','Control order subida a CEIPAL','Solo en contratos de dependencia (los contractor no llevan control order).','c',0,['Q025'],()=>qaDep(),'st'],

const qaIReq=it=>typeof it[6]==='function'?!!it[6]():!!it[6];
const qaIVal=it=>{const o=it[7]==='docs'?QA.docs:QA.st;const v=o[it[0]];return v===true?'Sí':String(v||'').trim()};
function qaStepStat(k){
  if(k==='ent'){const t=qaReqTot(),m=qaReqMiss();return{t,d:t-m,miss:qaMissing().map(f=>qaLbl(f))}}
  const rq=QA_ITEMS[k].filter(qaIReq),miss=rq.filter(it=>!qaIVal(it));return{t:rq.length,d:rq.length-miss.length,miss:miss.map(it=>it[1])};
}
const qaPct=s=>s.t?Math.round(s.d/s.t*100):100;
function qaAll(){const st=QA_STEPS.map(([k])=>qaStepStat(k)),t=st.reduce((a,s)=>a+s.t,0),d=st.reduce((a,s)=>a+s.d,0);return{st,t,d,pct:t?Math.round(d/t*100):0}}
const qaStepUpTo=e=>({entrevista:1,enviado:2,cliente:3,oferta:4,contratado:4,rechazado:0,desistio:0}[e]||1);
function qaNextTxt(){const A=qaAll();for(let i=0;i<QA_STEPS.length;i++){const s=A.st[i];if(s.miss.length&&i<Math.max(1,qaStepUpTo(QA.estado)))return`${QA_STEPS[i][1]}: ${s.miss[0]}${s.miss.length>1?` (+${s.miss.length-1})`:''}`}return''}
const qaEst=k=>QA_EST.find(x=>x[0]===k)||QA_EST[0];
const qaDate=t=>new Date(t).toLocaleDateString(LOC(),{day:'numeric',month:'short'});

/* --- Vistas --- */
V.qa=()=>`<div class="pagehead"><div class="meta"><span class="eyebrow">Talent Quality Intelligence · 28 criterios</span><h1>Candidatos QA</h1>
  <span class="muted">Un expediente por candidato: entrevista, submittal, cliente y contratación, con lo que audita QA en cada paso.</span></div></div>

function renderQA(){
  if(!$('qaBody'))return;
  if(QA.view==='notes'){QA.view='cand';QA.sub='ent'}if(QA.view==='ck'){QA.view='cand';QA.sub='sub'}
  if(QA.view==='cand'&&!qaCur())QA.view='list';
  const act=QAD.list.filter(r=>!QA_FINAL.includes(r.estado)).length;
  $('qaViews').innerHTML=`<button class="chip" type="button" data-qaview="list" aria-pressed="${QA.view!=='crit'}">👥 Candidatos <span class="muted">${act} en proceso</span></button><button class="chip" type="button" data-qaview="crit" aria-pressed="${QA.view==='crit'}">📊 Criterios TQI</button>`;
  if(QA.view==='crit'){$('qaBody').innerHTML=qaCritView();qaCritGrid();return}
  if(QA.view==='list'){$('qaBody').innerHTML=qaListView();return}
  $('qaBody').innerHTML=qaCandView();if(QA.sub==='ent')qaAnalyze();
}
function qaCardInfo(r){return qaWith(r,()=>{const A=qaAll();return{A,next:qaNextTxt(),cargo:qaVv('cargo'),flags:qaScan().flags.length}})}
function qaListView0(){
  const F=QA.filt||'proc',q=norm(QA.lq||''),cnt={proc:0,cont:0,rech:0,all:QAD.list.length};
  QAD.list.forEach(r=>{if(r.estado==='contratado')cnt.cont++;else if(QA_FINAL.includes(r.estado))cnt.rech++;else cnt.proc++});
  const L2=QAD.list.filter(r=>(F==='all'||(F==='proc'&&!QA_FINAL.includes(r.estado))||(F==='cont'&&r.estado==='contratado')||(F==='rech'&&(r.estado==='rechazado'||r.estado==='desistio')))&&(!q||norm((r.v&&r.v.nombre||'')+' '+(r.jd||'').slice(0,200)).includes(q))).sort((a,b)=>b.updated-a.updated);
  return `<div class="qa-bar"><button class="btn primary" type="button" data-qaadd>＋ Nuevo candidato</button><input type="search" data-qalq placeholder="Buscar por nombre o vacante…" value="${esc(QA.lq||'')}" style="flex:1;min-width:180px"><button class="btn" type="button" data-qaexp>⬇️ Respaldo</button><label class="btn" style="cursor:pointer">⬆️ Cargar respaldo<input type="file" accept=".json,application/json" data-qaimp hidden></label></div>
  <div class="slafil">${[['proc','⏳ En proceso'],['cont','✅ Contratados'],['rech','❌ Rechazados / desistieron'],['all','Todos']].map(([k,t])=>`<button class="chip" type="button" data-qafilt="${k}" aria-pressed="${F===k}">${t} <span class="muted">${cnt[k]}</span></button>`).join('')}</div>
  ${L2.length?`<div class="qa-clist">${L2.map(r=>{const I=qaCardInfo(r),E=qaEst(r.estado),fin=QA_FINAL.includes(r.estado);return `<button type="button" class="qa-cc ${r.estado}" data-qaopen="${r.id}">
    <div class="qa-cch"><b>${esc(r.v&&r.v.nombre||'Sin nombre')}</b><span class="pill ${E[2]}">${esc(E[1])}</span></div>
    <span class="muted small">${esc(I.cargo||'Sin vacante')} · actualizado ${qaDate(r.updated)}</span>
    <div class="qa-dots">${QA_STEPS.map(([k,t,ic,sh],i)=>{const p=qaPct(I.A.st[i]);return `<span class="qa-dot ${p===100?'ok':p>0?'part':''}" title="${esc(t)} ${p}%"><i>${ic}</i>${esc(sh||t)}</span>`}).join('')}</div>
    <div class="qa-meter ${I.A.pct===100?'ok':''}"><i style="width:${I.A.pct}%"></i></div>
    <span class="small ${I.next&&!fin?'':'muted'}">${r.estado==='contratado'?(I.A.pct===100?'🎉 Expediente completo':`⚠️ Contratado con ${I.A.t-I.A.d} pendientes`):fin?esc(r.motivo||'Proceso cerrado'):I.next?'👉 '+esc(I.next):'✓ Al día en lo que va del proceso'}${I.flags&&!fin?` · 🚩 ${I.flags}`:''}</span></button>`}).join('')}</div>`
  :`<div class="empty">${QAD.list.length?'No hay candidatos con ese filtro.':'Aún no tienes candidatos. Toca <b>＋ Nuevo candidato</b> para empezar una entrevista.'}</div>`}
  <p class="muted small">Los candidatos se guardan en este navegador. Descarga un respaldo de vez en cuando, o para pasarlos a otro computador.</p>`;
}
function qaCandView(){
  const r=qaCur(),A=qaAll(),E=qaEst(QA.estado),fin=QA_FINAL.includes(QA.estado);
  const head=`<section class="panel qa-head"><div class="qa-hrow"><button class="btn sm" type="button" data-qaview="list">← Candidatos</button>
      <div class="qa-hname"><b>${esc(QA.v.nombre||'Sin nombre')}</b><span class="muted small">${esc(qaVv('cargo')||'Sin vacante')} · creado ${qaDate(r.created)}</span></div>
      <div class="qa-hpct"><div class="qa-ring sm" style="--p:${A.pct}"><b>${A.pct}%</b></div><span class="muted small">expediente</span></div></div>
    <div class="qa-est"><span class="muted small">Estado:</span>${QA_EST.map(([k,t,c])=>`<button type="button" class="chip" data-qaest="${k}" aria-pressed="${QA.estado===k}">${esc(t)}</button>`).join('')}</div>
    ${QA.estado==='contratado'?(A.pct===100?'<div class="status ok">🎉 Contratado con el expediente completo<small>Todo lo que QA revisa en una auditoría post hire quedó listo.</small></div>':`<div class="status wait">⚠️ Contratado, pero faltan ${A.t-A.d} pasos para que el expediente quede completo<small>Las control orders siempre se auditan. Revisa los pasos en naranja.</small></div>`):''}
    ${QA.estado==='rechazado'||QA.estado==='desistio'?`<div class="qa-mot"><span class="muted small">Motivo:</span>${QA_MOT.map(m=>`<button type="button" class="chip" data-qamot="${esc(m)}" aria-pressed="${QA.motivo===m}">${esc(m)}</button>`).join('')}<input type="text" data-qamottxt placeholder="Detalle (opcional)" value="${esc(QA.motivoTxt||'')}"></div>
      <div class="actions"><span class="muted small">Su información queda guardada en "Rechazados / desistieron". Si no la necesitas:</span><button class="btn sm" type="button" data-qadel>🗑️ Eliminar candidato</button></div>`:''}
    <div class="qa-steps">${QA_STEPS.map(([k,t,ic],i)=>{const s=A.st[i],p=qaPct(s);return `<button type="button" class="qa-step ${QA.sub===k?'on':''} ${p===100?'ok':p>0?'part':''}" data-qastep="${k}"><span class="n">${p===100?'✓':ic}</span><span><b>${i+1}. ${esc(t)}</b><small>${s.d}/${s.t} · ${p}%</small></span></button>`}).join('')}</div></section>`;
  let body='';
  if(QA.sub==='ent')body=qaVacHtml()+qaNotesView();
  else body=qaStepView(QA.sub);
  return head+body+(QA.sub!=='ent'||fin?'':'')+`<div class="actions" style="justify-content:space-between"><button class="btn sm" type="button" data-qadel>🗑️ Eliminar candidato</button><span class="muted small">Se guarda solo mientras escribes.</span></div>`;
}
function qaItemHtml(it){
  const [k,l,h,t,o,cr,,w]=it,req=qaIReq(it),val=qaIVal(it),src=w==='docs'?QA.docs:QA.st,codes=cr.map(c=>`<span class="pill ${QA_SEV[qaCrit(c)[2]][1]}">${c}</span>`).join('');
  if(t==='c')return `<button type="button" class="qa-q qa-it ${req&&!val?'qa-need':''}" data-qait="${k}" aria-pressed="${!!src[k]}"><span class="bx"></span><span><b>${esc(l)}</b>${req?' <b class="qa-star">*</b>':' <span class="muted small">(si aplica)</span>'}${h?`<span class="sub">${esc(h)}</span>`:''}</span><span class="cds">${codes}</span></button>`;
  const ctl=t==='s'?`<div class="qa-opts">${o.map(x=>`<button type="button" class="chip" data-qaiopt="${k}" data-v="${esc(x)}" aria-pressed="${src[k]===x}">${esc(x)}</button>`).join('')}</div>`:t==='d'?`<input type="date" data-qaiin="${k}" value="${esc(src[k]||'')}">`:`<textarea rows="2" data-qaiin="${k}" placeholder="${esc(h||'')}">${esc(src[k]||'')}</textarea>`;
  return `<div class="qa-qa ${req&&!val?'qa-need':''} ${val?'done':''}"><div class="qa-qh"><b>${esc(l)}</b>${req?'<b class="qa-star">*</b>':'<span class="muted small">(opcional)</span>'}<span class="qa-cds">${codes}</span></div>${ctl}</div>`;
}
function qaStepView(k){
  const s=qaStepStat(k),p=qaPct(s),T={sub:['📎 Submittal','Documentos y envío. No tienes que hacerlo todo al terminar la entrevista: vuelve cuando subas cada cosa.'],cli:['🤝 Proceso con el cliente','Entrevista con el Hiring Manager y cualquier cambio en las condiciones.'],con:['✅ Contratación','Lo que QA revisa en la auditoría post hire (control order).']}[k];
  let extra='';
  if(k==='sub'){const S=qaScan(),crit=QA_CK.map((x,i)=>i).filter(i=>i<6||i===12||i===13);extra=`<section class="panel"><div class="panel-head"><h2>🔎 Validación QA desde la entrevista</h2><span class="muted small">Se marca sola con tus notas; tócala si necesitas corregirla</span></div>
    ${crit.map(i=>{const x=QA_CK[i],on=qaCkOn(i),a=qaCkAuto(i);return `<button type="button" class="qa-q" data-qack="${i}" aria-pressed="${on}"><span class="bx"></span><span>${esc(x[1])}<span class="sub">${a===null?'Manual':QA.ck[i]!=null?'Marcado a mano':a?'⚡ Desde tus notas':'⚡ Se marca solo cuando lo llenes en la entrevista'}</span></span><span class="cds">${x[2].map(qaPill).join('')}</span></button>`}).join('')}
    ${S.flags.length?`<div class="stack" style="gap:6px"><b class="small">🚩 Alertas de la entrevista</b>${S.flags.map(f=>`<div class="qa-alert"><b>${esc(f[0])}</b> <span class="pill c-crit">${esc(f[1])}</span></div>`).join('')}</div>`:''}</section>`}
  if(k==='cli'&&QA.st.cli_res==='No avanza'&&QA.estado!=='rechazado')extra=`<div class="status no">El cliente no avanzó con el candidato<small><button class="btn sm" type="button" data-qaest="rechazado">Marcar como rechazado</button></small></div>`;
  if(k==='cli'&&QA.st.cli_res==='Avanza'&&qaStepUpTo(QA.estado)<4)extra=`<div class="status ok">El candidato avanza<small><button class="btn sm" type="button" data-qaest="oferta">Pasar a contratación</button></small></div>`;
  if(k==='con'){const all=qaAll();extra=QA.estado!=='contratado'?`<div class="status ${s.d===s.t?'ok':'wait'}">${s.d===s.t?'Todo listo para cerrar como contratado':'Cuando quede contratado, márcalo aquí'}<small><button class="btn sm ${s.d===s.t?'primary':''}" type="button" data-qaest="contratado">✅ Marcar como contratado</button>${all.t-all.d?` · Faltan ${all.t-all.d} pasos en todo el expediente`:''}</small></div>`:''}
  return `<section class="panel"><div class="panel-head"><h2>${T[0]}</h2><span class="pill ${p===100?'c-ok':'c-warn'}">${s.d}/${s.t} obligatorios</span></div><p class="muted small">${T[1]}</p>
    <div class="qa-meter ${p===100?'ok':''}"><i style="width:${p}%"></i></div><div class="qa-qlist">${QA_ITEMS[k].map(qaItemHtml).join('')}</div></section>${extra}`;
}
function qaCreateSheet(){
  const seen=new Map();QAD.list.forEach(r=>{const j=String(r.jd||'').trim();if(j&&!seen.has(j)){let t='';try{t=parseJD(j).title}catch(e){}seen.set(j,(r.v&&r.v.cargo)||t||j.slice(0,40))}});
  const vac=[...seen.entries()];
  openSheet(`<h2>Nuevo candidato</h2><label class="qa-fl"><span class="qa-lb">Nombre del candidato</span><input type="text" id="qaNewName" placeholder="Nombre y apellido"></label>
    <label class="qa-fl"><span class="qa-lb">Vacante</span><select id="qaNewVac"><option value="">Nueva vacante (pegaré el JD)</option>${vac.map(([j,t],i)=>`<option value="${i}">${esc(t)}</option>`).join('')}</select></label>
    ${QAD.cur&&qaCur()?'<p class="muted small">Tip: si es para la misma vacante del candidato que tenías abierto, elígela en la lista y no tienes que volver a pegar el JD.</p>':''}
    <div class="actions"><button class="btn primary" type="button" data-qacreate>Crear y empezar la entrevista</button><button class="btn" type="button" data-close>Cancelar</button></div>`);
  window.__qaVac=vac;setTimeout(()=>{const x=$('qaNewName');x&&x.focus()},50);
}
function qaExport(){const data=JSON.stringify({tipo:'cositas-candidatos-qa',fecha:new Date().toISOString(),candidatos:QAD.list},null,1),fn=`candidatos_qa_${new Date().toISOString().slice(0,10)}.json`;
  (async()=>{try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:fn,data});toast('Respaldo descargado.');return}}catch(e){}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();toast('Respaldo descargado.')}catch(e){toast('No se pudo descargar el respaldo.')}})()}
function qaImport(file){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result),arr=Array.isArray(d)?d:d.candidatos;if(!Array.isArray(arr))throw 0;let n=0;
  arr.forEach(r=>{if(!r||!r.id)return;const i=QAD.list.findIndex(x=>x.id===r.id);if(i>=0){if((r.updated||0)>=(QAD.list[i].updated||0))QAD.list[i]=r}else QAD.list.push(r);n++});
  if(QAD.cur)qaLoad(QAD.cur);qaPersist(true);renderQA();toast(`Respaldo cargado: ${n} candidato${n===1?'':'s'}.`)}catch(e){toast('Ese archivo no es un respaldo válido.')}};fr.readAsText(file)}
function qaOpen(id,sub){qaPersist(true);qaLoad(id);QA.view='cand';if(sub)QA.sub=sub;qaPersist(true);renderQA();window.scrollTo(0,0)}
function qaRefreshHead(){if(QA.view!=='cand'||!$('qaBody'))return;const h=document.querySelector('.qa-head');if(!h)return;const tmp=document.createElement('div');tmp.innerHTML=qaCandView();const nh=tmp.querySelector('.qa-head');if(nh)h.replaceWith(nh)}

/* ================== Búsqueda global ================== */
function globalSearch(q){
  const n=norm(q),R=[];if(!n)return R;
  const add=(tab,title,sub)=>R.push({tab,title,sub});
  DATA.proceso.forEach(s=>{if(norm(s.etapa+s.desc+s.tool+s.sla).includes(n))add('proceso',s.etapa,s.sla)});
  ST.forEach(x=>{if(norm(x.s+x.d+x.who).includes(n))add('status',x.n+'. '+x.s,x.who+' · '+x.sla)});
  (DATA.novedades||[]).forEach(x=>{if(norm(x.titulo+x.texto+(x.autor||'')).includes(n))add('novedades',x.titulo,x.fecha)});
  OBJ.forEach(x=>{if(norm(x.q+x.es+x.cat).includes(n))add('objeciones',x.q,x.cat)});
  TPL.forEach(x=>{if(norm(x.n+x.d).includes(n))add('plantillas',x.n,x.d)});
  if(norm('funnel embudo screened hired drop off fuentes conversion').includes(n))add('funnels','Funnels','Embudo, descartes y fuentes');
  if(norm('fecha de ingreso start date calculadora').includes(n))add('ingreso','Calculadora de fecha de ingreso','Días mínimos y cortes por país');
  PAGOS.forEach(x=>{if(norm(x.pais+x.resp+x.tipo+x.pago+' pago metodo banco').includes(n))add('pagos',x.pais+' · '+x.resp,x.tipo+' · '+x.pago)});
  SLA_PH.forEach(([t,h,x])=>{if(norm(t+(x||'')+' sla prehiring').includes(n))add('sla',t,h+' horas hábiles')});
  QA_CRIT.forEach(c=>{if(norm(c.join(' ')+' qa tqi criterio auditoria').includes(n))add('qa',c[0]+' · '+c[1],QA_SEV[c[2]][0]+' · '+c[4])});
  QA_B.forEach(b=>{if(norm(b.t+' '+(b.qs||[]).join(' ')+' entrevista screening').includes(n))add('qa','Bloque '+b.n+' · '+b.t,'Candidatos QA · Entrevista')});
  NOSIGUE.concat(PAUSA).forEach(([es,en])=>{if(norm(es+en).includes(n))add('status',en,es)});
  SUPQ.forEach(([q,a])=>{if(norm(q+a).includes(n))add('sups',q,a.slice(0,80))});if(norm('supervisor salario script expectativa bonos rango').includes(n)||n.includes('supervisor'))add('sups','Salario y script de Supervisores','Rangos JR, SP y SR por país');
  DATA.ceipal.notas.forEach(s=>{if(norm(s.nota+s.uso).includes(n))add('ceipal',s.nota,s.uso)});
  DATA.ceipal.prot.forEach(s=>{if(norm(s.sit+s.prot).includes(n))add('ceipal',s.sit,s.prot)});
  DATA.fu_notes.forEach(s=>{if(norm(s.tema+s.regla).includes(n))add('followup',s.tema,s.regla.slice(0,90)+'…')});
  DATA.contratos.forEach(s=>{if(norm(s.pais+s.tipo+s.cond+s.benef+s.notas+s.partner).includes(n))add('contratos',s.pais+' · '+s.tipo,s.partner)});
  DATA.sites.forEach(s=>{if(norm(s.site+s.ciudad+s.dir+s.pais).includes(n))add('sites',s.site,[s.ciudad,s.pais].filter(Boolean).join(', '))});
  DATA.links.forEach(s=>{if(norm(s.name+s.desc+s.label).includes(n))add('links',s.name,s.desc)});
  DATA.horarios.forEach(s=>{if(norm(s.ta).includes(n))add('horarios',s.ta,`Usuario ${s.cuenta} · ${hm(s.ini)}–${hm(s.fin)}`)});
  return R.slice(0,30);
}

  if(e.target.closest('#tplForm')){TP.f[e.target.name]=e.target.value;store.set('tpl',TP);tplOut();return}
  if(e.target.dataset&&(e.target.dataset.fnet||e.target.dataset.fnr)){const v=Math.max(0,parseInt(e.target.value,10)||0),f=FN.list[FN.sel];
    if(e.target.dataset.fnet)f.et[e.target.dataset.fnet]=v;else{const [k,i]=e.target.dataset.fnr.split(':');f[k][+i][1]=v}fnSave();fnTables();return}
  if(e.target.id==='fnFecha'){FN.list[FN.sel].fecha=e.target.value;fnSave();fnTables();return}
  if(e.target.id==='slaAt'){SLA.at=e.target.value;slaCalc();return}
  if(e.target.id==='slaIni'||e.target.id==='slaFin'){SLA[e.target.id==='slaIni'?'ini':'fin']=e.target.value;store.set(e.target.id==='slaIni'?'slaini':'slafin',e.target.value);slaCalc();return}
  const id=e.target.id;
  if(id.startsWith('ck')){CK.exists=$('ckExists').value;CK.active=$('ckActive').value;CK.last=$('ckLast').value;CK.date=$('ckDate').value;CK.time=$('ckTime').value;ceipalCheck();return}
  if(id==='fuSubj'||id==='fuBody'){updMail();return}
  if(id.startsWith('fu')){const k={fuDate:'date',fuCliente:'cliente',fuEmpresa:'empresa',fuCargo:'cargo',fuCands:'cands',fuYo:'yo',fuTo:'to'}[id];if(k){FU[k]=e.target.value;store.set('fu',FU);if(k==='date')FUSEL=null;renderFU()}return}
  if(id==='ivJd'){JD.text=e.target.value;IVAI=null;for(const x in AIOUT)delete AIOUT[x];store.set('jd',JD);clearTimeout(renderIV._t);renderIV._t=setTimeout(renderIV,250);return}
  if(id==='ivCand'){IV.cand=e.target.value;store.set('iv',IV);return}
  if(id.startsWith('ivn_')){const q=id.slice(4);IVST[q]=IVST[q]||{};IVST[q].n=e.target.value;return}
  if(e.target.dataset&&e.target.dataset.ivon){const q=e.target.dataset.ivon;IVST[q]=IVST[q]||{};IVST[q].off=!e.target.checked;e.target.closest('.q').classList.toggle('off',!e.target.checked);return}
  if(id.startsWith('jd')&&id!=='jdOut'){const k={jdText:'text',jdTitle:'title',jdLoc:'loc',jdMod:'mod',jdSched:'sched',jdEng:'eng',jdSal:'sal',jdLink:'link',jdYo:'yo',jdOSum:'o_sum',jdOResp:'o_resp',jdOReqs:'o_reqs',jdOBen:'o_ben'}[id];if(k){JD[k]=e.target.value;for(const x in AIOUT)delete AIOUT[x];store.set('jd',JD);renderJD()}return}
  if(id==='stAt'){STCK.at=e.target.value;renderST();$('stAt')&&$('stAt').focus();return}
  if(id==='supExp'){const d=e.target.value.replace(/[^\d]/g,'');SUP.exp=d?new Intl.NumberFormat(LOC()).format(+d):'';store.set('sup',SUP);const pos=e.target.value.length;renderSup();return}
  if(id==='peTotal'||id==='peRange'||id==='peRmv'){if(id==='peRange')$('peTotal').value=e.target.value;if(id==='peTotal')$('peRange').value=e.target.value;PE.total=+$('peTotal').value;PE.rmv=+$('peRmv').value||1130;store.set('pe',PE);renderPE();return}
  if(id==='salPais'||id==='salTotal'){SAL.pais=$('salPais').value;SAL.total=$('salTotal').value;store.set('sal',SAL);renderSal();return}
  if(id==='sQ'||id==='sPais'||id==='sComp'||id==='sOff'){SF.q=$('sQ').value;SF.pais=$('sPais').value;SF.comp=$('sComp').value;SF.showOff=$('sOff').checked;renderSites();return}
  if(id==='lQ'){LQ=e.target.value;renderLinks();return}
  if(id==='hMe'){if(ME!==e.target.value){ME=e.target.value;store.set('me',ME);go('horarios')}return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='fnFile'&&e.target.files[0]){fnImport(e.target.files[0]);e.target.value='';return}
if(['ckExists','ckActive','ckLast','jdMod','salPais','sPais','sComp','sOff','hMe'].includes(e.target.id))e.target.dispatchEvent(new Event('input',{bubbles:true}))});

const h0=location.hash.slice(1);
go(V[h0]?h0:(V[store.get('tab','proceso')]?store.get('tab','proceso'):'proceso'));
(async()=>{try{if(window.claude&&window.claude.use){SAMPLE=await window.claude.use('sample');if(VIEW==='jd'&&$('jdAI'))$('jdAI').hidden=!SAMPLE;if($('qaAIbtn'))$('qaAIbtn').hidden=!SAMPLE}}catch(e){}})();
</script>
