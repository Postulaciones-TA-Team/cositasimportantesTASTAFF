<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Cositas Importantes TA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fija con pestañas; cada pestaña es una herramienta de consulta o un generador, de resumen a detalle */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#1B2033; --muted:#646B85; --line:#E1E4EE;
  --accent:#5552D1; --accent-soft:#ECEBFD; --on-accent:#FFFFFF;
  --client:#23845A; --client-soft:#E3F4EB; --internal:#7A4FC2; --internal-soft:#F0E9FB;
  --crit:#C93C3C; --crit-soft:#FBE9E9; --warn:#B9770E; --warn-soft:#FBF1DE; --ok:#23845A; --ok-soft:#E3F4EB; --done:#7C8299; --done-soft:#EEEFF3;
  --scrim:rgba(20,22,35,.45);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141D; --surface:#1A1D29; --ink:#E8EAF2; --muted:#9CA2B8; --line:#2B2F3F;
  --accent:#9A97F5; --accent-soft:#26254A; --on-accent:#12141D;
  --client:#5CC994; --client-soft:#183126; --internal:#B996F2; --internal-soft:#2C2240;
  --crit:#F07373; --crit-soft:#3A2024; --warn:#E9AE4A; --warn-soft:#3A2F1A; --ok:#5CC994; --ok-soft:#183126; --done:#9298AE; --done-soft:#252836; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141D; --surface:#1A1D29; --ink:#E8EAF2; --muted:#9CA2B8; --line:#2B2F3F;
  --accent:#9A97F5; --accent-soft:#26254A; --on-accent:#12141D;
  --client:#5CC994; --client-soft:#183126; --internal:#B996F2; --internal-soft:#2C2240;
  --crit:#F07373; --crit-soft:#3A2024; --warn:#E9AE4A; --warn-soft:#3A2F1A; --ok:#5CC994; --ok-soft:#183126; --done:#9298AE; --done-soft:#252836; --scrim:rgba(0,0,0,.6); color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:14.5px;font-weight:600}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:8px}
.menubtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600}
.menubtn:hover,.menubtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.curtab{font-family:var(--f-display);font-weight:600;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langbtn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:var(--surface)}
.langbtn span{padding:6px 9px;font-size:12.5px;font-weight:600;color:var(--muted)}
html[lang="es"] .langbtn [data-l="es"],html[lang="en"] .langbtn [data-l="en"]{background:var(--ink);color:var(--surface)}
.dscrim{position:fixed;inset:0;background:var(--scrim);z-index:25}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--surface);border-right:1px solid var(--line);overflow:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.drawer .dhead{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.dgroup{display:flex;flex-direction:column;gap:2px}
.dgroup .lbl{padding:0 10px 4px}
.ditem{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font-weight:500;color:var(--ink)}
.ditem:hover{background:var(--bg)}
.ditem[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:no-preference){.drawer{animation:dIn .18s ease-out}@keyframes dIn{from{transform:translateX(-12px);opacity:.6}}}
.brand{font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap}
.brand span{color:var(--accent)}

.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 11px;border-radius:8px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.searchbox{width:190px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}

.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.pagehead .meta{display:flex;flex-direction:column;gap:3px;max-width:680px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-side{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
button.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c,var(--muted));background:var(--cs,var(--done-soft))}
.c-client{--c:var(--client);--cs:var(--client-soft)} .c-int{--c:var(--internal);--cs:var(--internal-soft)}
.c-ok{--c:var(--ok);--cs:var(--ok-soft)} .c-warn{--c:var(--warn);--cs:var(--warn-soft)} .c-crit{--c:var(--crit);--cs:var(--crit-soft)} .c-acc{--c:var(--accent);--cs:var(--accent-soft)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form .full{grid-column:1/-1}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0}
textarea{resize:vertical}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1 1 220px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.note{font-size:12.5px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:9px 12px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.pre{white-space:pre-line}

/* Proceso */
.steps{display:flex;flex-direction:column;gap:0;position:relative}
.step{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:14px}
.step:not(:last-child)::before{content:"";position:absolute;left:21px;top:40px;bottom:0;width:2px;background:var(--line)}
.step .n{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
.step .body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.step .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step .meta div{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flow .arrow{color:var(--muted)}

.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:13px}
/* Acordeones */
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);color:var(--muted);font-size:16px}
details.acc[open]>summary::after{content:"–"}
details.acc[open]{border-color:var(--accent)}
details.acc .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.step .n.sm{width:36px;height:36px;font-size:15px}
.step.compact{grid-template-columns:36px 1fr;padding-bottom:8px}
.step.compact:not(:last-child)::before{left:17px;top:36px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.tile{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile b{font-family:var(--f-display);font-size:16px;font-weight:600;line-height:1.2}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px}
.prot{display:flex;flex-direction:column;gap:8px}
.protrow{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center}
.protbar{height:26px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-family:var(--f-mono);font-size:12px;color:var(--surface);white-space:nowrap;overflow:hidden}
.cflow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.cflow{grid-template-columns:1fr}.protrow{grid-template-columns:1fr}}
/* Status CEIPAL */
.sflow{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.sbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;min-width:0;border-top:4px solid var(--oc)}
.sbtn .sn{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--oc)}
.sbtn .st{font-size:11.5px;line-height:1.25}
.sbtn .ss{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sbtn[aria-pressed="true"]{background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.o-rec{--oc:var(--accent)} .o-poc{--oc:var(--warn)}
.sown{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin-bottom:-4px}
.sown span{border-radius:8px 8px 0 0;padding:5px 8px;font-size:12px;font-weight:600;text-align:center;background:var(--oc);color:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handoff{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.sdetail{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.sname{font-family:var(--f-mono);font-size:17px;font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:inline-block}
.sitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.sit{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.sit:hover{border-color:var(--accent)}
.sit b{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--accent)}
@media (max-width:900px){.sflow{grid-template-columns:repeat(3,minmax(0,1fr))}.sown{display:none}}
/* CEIPAL */
.verdict{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.verdict .big{font-family:var(--f-display);font-size:20px;font-weight:700}
.verdict.ok{background:var(--ok-soft)} .verdict.ok .big{color:var(--ok)}
.verdict.warn{background:var(--warn-soft)} .verdict.warn .big{color:var(--warn)}
.verdict.crit{background:var(--crit-soft)} .verdict.crit .big{color:var(--crit)}
.notechips{display:flex;flex-wrap:wrap;gap:8px}
.notechip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 200px}
.notechip b{font-family:var(--f-mono);font-weight:500;font-size:13px}
.notechip span{font-size:12px;color:var(--muted)}
.notechip:hover{border-color:var(--accent)}

/* Follow up */
.tl{display:flex;flex-direction:column;gap:6px}
.tli{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tli .d{font-family:var(--f-mono);font-size:12.5px;line-height:1.3}
.tli .d small{display:block;color:var(--muted);font-size:11px}
.tli.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tli.past{opacity:.6}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* Follow up pasos */
.fusteps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.fustep{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;min-width:0}
.fustep b{font-family:var(--f-mono);font-size:12px;font-weight:500;white-space:nowrap}
.fustep.past{opacity:.55}
.fustep.now{border-color:var(--warn);background:var(--warn-soft)}
.fustep[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
@media (max-width:700px){.fusteps{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* JD */
.outtabs{display:flex;gap:6px;flex-wrap:wrap}
.out{width:100%;min-height:300px;font-family:var(--f-body);font-size:13.5px;line-height:1.55}
.detected{display:flex;flex-wrap:wrap;gap:6px}

/* Entrevista */
.qlist{display:flex;flex-direction:column;gap:8px}
.qcat{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-top:6px}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;background:var(--surface)}
.q.off{opacity:.45}
.q .qt{font-size:13.5px}
.q .why{font-size:12px;color:var(--muted)}
.q .rate{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q .rate button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 9px;font-size:12px}
.q .rate button[aria-pressed="true"].r3{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.q .rate button[aria-pressed="true"].r2{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.q .rate button[aria-pressed="true"].r1{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.q .rate input{flex:1 1 160px;padding:4px 8px;font-size:12.5px}
.q input[type=checkbox]{width:18px;height:18px;margin-top:2px;padding:0}
.score{display:flex;gap:8px;flex-wrap:wrap}
/* Contratos */
.countries{display:flex;gap:6px;flex-wrap:wrap}
.ccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--bg);border-radius:8px;padding:6px 9px;display:flex;flex-direction:column;font-size:12.5px;min-width:0}
.facts span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ccard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* Salarios */
.split{display:flex;height:42px;border-radius:8px;overflow:hidden}
.split div{display:flex;align-items:center;justify-content:center;color:var(--surface);font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;overflow:hidden;min-width:0}
.bigmoney{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13.5px}
.kv .v{font-family:var(--f-mono);text-align:right}

/* Sites / Links */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .t{font-weight:600}
.card .s{font-size:12.5px;color:var(--muted)}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}

/* Reloj mundial */
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.clk{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);min-width:0}
.clk .top{display:flex;align-items:center;gap:8px}
.clk .fl{font-size:22px;line-height:1}
.clk .nm{font-weight:600}
.clk .tm{font-family:var(--f-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.clk .df{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.clk .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto}
.clk.home{border-color:var(--accent);background:var(--accent-soft)}
/* Supervisores */
.lvlseg{display:inline-flex;gap:6px;flex-wrap:wrap}
.verdict small{display:block;font-weight:400;color:var(--ink);font-size:13px;margin-top:2px}
.rgtbl td.sel{background:var(--accent-soft);font-weight:600}
.rgtbl tr.cur td:first-child{font-weight:700;color:var(--accent)}
.rgtbl td small{display:block;color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chat{display:flex;flex-direction:column;gap:8px}

MxOTMyMSJ9", "desc": "Mostrar el movimiento de la posición en números."}, {"name": "Solicitud de CDP", "label": "DataHelpDesk", "url": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=I2XspS3VPUS-vO7PE6rnrMWtLRsqRQpFrxZ3RtV-o1dUN0o0NUc0T1Y3N1pHWk9LNEw1R0I2UTRYSS4u", "desc": "Para cuando las posiciones son Replacement y no está el CDP - se requiere el"}, {"name": "Form de ingreso Relación de dependencia Mexico", "label": "Formulario Nuevo Ingreso", "url": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=I2XspS3VPUS-vO7PE6rnrMWtLRsqRQpFrxZ3RtV-o1dURVJTS0hEQldJR0VVVFVPRDZLQk9MWlFFUC4u", "desc": ""}], "fu_obj": ["Optimizar y estandarizar la comunicación entre los actores del proceso de reclutamiento enfocado en nuestros clientes (TA, Ventas y Onboarding) para colocar hires de la forma más rápida y eficiente posible. Una comunicación efectiva asegura que el cliente responda y que los candidatos sean considerados y entrevistados a tiempo, reduciendo los ciclos de desconexión, demoras y seguimientos.\nLos clientes nuevos son muy importantes: activarlos y hacerlos crecer es parte de nuestro objetivo como Talent Acquisition. Trabajar junto con Onboarding permite movilizar y garantizar estos hires, dejando a Ventas enfocado en sus funciones. La relación y el enfoque correctos del POC de TA y del agente de OB con el cliente serán el camino hacia el éxito de los clientes nuevos y el crecimiento orgánico.", "1. Cronograma general (resumen)"], "fu_notes": [{"n": "1", "tema": "Respuestas del cliente", "regla": "Si el cliente responde a nuestros correos, debe ser un feedback concreto sobre los candidatos presentados. Respuestas como \"estamos revisando\", \"gracias, lo reviso\", \"quedamos atentos\", \"les escribimos pronto\" cuentan como respuesta, pero no como la que necesitamos para saber si el pipeline avanza. En esos casos NO se inicia el proceso de follow up: el Especialista de Activación de Clientes llama ese mismo día al Implementation Manager para darle visibilidad de las respuestas y al día siguiente llama al cliente para hacer seguimiento a los próximos pasos con base en los primeros candidatos enviados."}, {"n": "2", "tema": "Canales y responsable", "regla": "Todas las comunicaciones de seguimiento las envía TA, a través del Especialista de Activación de Clientes a cargo del cliente, en este orden: 1) llamada; 2) si no contesta, correo; 3) finalmente, un SMS con el resumen del último correo enviado."}, {"n": "3", "tema": "Frecuencia y duración", "regla": "Cada contacto se hace como muestra el calendario: unos cada 48 horas y otros cada 72 horas. Desde el envío del 1.er candidato, todo el proceso de follow up y el aviso final de cancelación de la requisición toma 22 días hábiles."}, {"n": "4", "tema": "Candidatos mínimos para iniciar", "regla": "Los reclutadores deben enviar 3 candidatos por posición (si el cliente solicita 2 o más vacantes) y máximo 5 candidatos por posición (si solicita solo 1 vacante) para iniciar el proceso de follow up."}, {"n": "5", "tema": "Cliente de vacaciones / PTO / fuera de oficina", "regla": "El contador de seguimientos se detiene. De acuerdo con Ventas y el Implementation Manager se toma una de estas rutas: 1) intentar contactar a un segundo punto de contacto de respaldo que indique el contacto principal; 2) si no hay respaldo, poner la posición en hold hasta que el cliente regrese. La reactivación es responsabilidad del Especialista de Activación de Clientes."}, {"n": "6", "tema": "Tiempo de respuesta de TA", "regla": "El equipo de TA se compromete a responder al cliente en máximo 3 horas hábiles: agendamiento de entrevistas de candidatos, preguntas y feedback en general."}, {"n": "7", "tema": "Límite de 5 candidatos", "regla": "Si ya se enviaron 5 candidatos al cliente y este no responde, sin importar en qué número de seguimiento estemos, se dejan de enviar candidatos nuevos hasta recibir feedback de los pendientes."}], "fu_tpls": [{"n": "1", "seg": "Seguimiento 1", "asunto": "Seguimiento a candidatos para el cargo de [Nombre del cargo]", "cuerpo": "Buenos días, [Nombre del cliente]:\n\nEspero que se encuentre muy bien.\n\nLe escribo para hacer seguimiento a la shortlist de candidatos que le compartí el [Fecha de envío] para el cargo de [Nombre del cargo] en [Empresa]. Le dejo un resumen para su referencia:\n• [Nombre del candidato 1]\n• [Nombre del candidato 2]\n• [Nombre del candidato 3]\n\nLos tres candidatos siguen muy interesados en la oportunidad y con ganas de avanzar en el proceso. Me han pedido novedades, por eso quería consultarle si tiene algún feedback inicial o si le gustaría programar entrevistas con alguno de ellos.\n\nQuedo pendiente de sus comentarios o de cualquier información adicional que necesite de mi parte.\n\nCordial saludo,\n[Su nombre]"}, {"n": "2", "seg": "Seguimiento 2", "asunto": "Segundo seguimiento a candidatos para el cargo de [Nombre del cargo]", "cuerpo": "Buenos días, [Nombre del cliente]:\n\nEspero que se encuentre muy bien.\n\nQuiero hacer un nuevo seguimiento a la shortlist de candidatos que le compartí el [Fecha de envío] para el cargo de [Nombre del cargo] en [Empresa]. Como recordatorio, los candidatos presentados fueron:\n• [Nombre del candidato 1]\n• [Nombre del candidato 2]\n• [Nombre del candidato 3]\n\nYa ha pasado poco más de una semana y los tres candidatos siguen muy interesados en la oportunidad. Me han vuelto a escribir para preguntar por los siguientes pasos, así que quería consultarle si tiene algún feedback o si desea avanzar con las entrevistas.\n\nPor favor, cuénteme cómo desea proceder o si necesita información adicional de mi parte. Con gusto le colaboro en lo que necesite.\n\nCordial saludo,\n[Su nombre]"}, {"n": "3", "seg": "Seguimiento 3", "asunto": "Tercer seguimiento a candidatos para el cargo de [Nombre del cargo]", "cuerpo": "Buenos días, [Nombre del cliente]:\n\nEspero que se encuentre muy bien.\n\nLe escribo nuevamente por la shortlist de candidatos que compartimos el [Fecha de envío] para el cargo de [Nombre del cargo] en [Empresa]. Como recordatorio, los candidatos que están en cola son:\n• [Nombre del candidato 1]\n• [Nombre del candidato 2]\n• [Nombre del candidato 3]\n\nHan pasado más de [X] días hábiles desde que enviamos los perfiles y todos los candidatos siguen interesados. Sin embargo, están participando activamente en otros procesos de selección y el riesgo de perderlos por ofertas de la competencia es cada vez mayor.\n\nEntiendo que las prioridades y agendas internas pueden cambiar, pero quería que tuviera total visibilidad para evitar perder talento valioso para este cargo. Si pudiera compartirme alguna novedad o indicarme si desea avanzar con las entrevistas, coordino todo de inmediato.\n\nGracias de antemano por su tiempo; quedo pendiente de sus noticias.\n\nCordial saludo,\n[Su nombre]"}, {"n": "4", "seg": "Seguimiento 4", "asunto": "Cuarto seguimiento a candidatos para el cargo de [Nombre del cargo]", "cuerpo": "Buenos días, [Nombre del cliente]:\n\nEspero que se encuentre muy bien.\n\nLe escribo una vez más para hacer seguimiento a la shortlist de candidatos que compartimos el [Fecha de envío] para el cargo de [Nombre del cargo] en [Empresa]. Como recordatorio, los candidatos que están en cola son:\n• [Nombre del candidato 1]\n• [Nombre del candidato 2]\n• [Nombre del candidato 3]\n\nHan pasado [X] días hábiles desde que enviamos los perfiles. Nuestra prioridad es seguir brindándole el apoyo y la experiencia necesarios para que el proceso de contratación sea exitoso. Sin embargo, dado el tiempo transcurrido, necesitamos avanzar para no perder talento valioso que está progresando en otros procesos.\n\nEn este punto, su compromiso oportuno es fundamental para mantener el proceso en la dirección correcta y lograr el mejor resultado posible para este cargo.\n\nApenas pueda compartirnos feedback actualizado, próximos pasos o disponibilidad para entrevistas, estaremos listos para coordinar de inmediato.\n\nGracias de antemano por su atención. Quedo pendiente de sus noticias.\n\nCordial saludo,\n[Su nombre]"}, {"n": "5–7", "seg": "Seguimientos 5, 6 y 7 (misma plantilla)", "asunto": "[Quinto / Sexto / Séptimo] seguimiento a candidatos para el cargo de [Nombre del cargo]", "cuerpo": "Buenos días, [Nombre del cliente]:\n\nEspero que se encuentre muy bien.\n\nLe escribo nuevamente por la shortlist de candidatos que compartimos el [Fecha de envío] para el cargo de [Nombre del cargo] en [Empresa]. Como recordatorio, los candidatos que están en cola son:\n• [Nombre del candidato 1]\n• [Nombre del candidato 2]\n• [Nombre del candidato 3]\n\nHan pasado [X] días hábiles desde que enviamos los perfiles y aún no hemos recibido feedback ni novedades del proceso. Todos los candidatos han seguido manifestando interés, pero en este punto están avanzando en otras oportunidades y la probabilidad de perderlos es muy alta.\n\nSeguimos totalmente comprometidos con apoyarle y con que esta búsqueda sea exitosa. Sin embargo, sin comunicación ni próximos pasos es cada vez más difícil mantener alineado el proceso y el interés de los candidatos.\n\nEn este punto necesitamos con urgencia su opinión para definir cómo proceder. Incluso una breve actualización nos ayudaría a manejar expectativas y a decidir el mejor curso de acción.\n\nGracias de antemano por su atención. Quedo pendiente de sus noticias.\n\nCordial saludo,\n[Su nombre]"}], "contratos": [{"pais": "Colombia", "tipo": "Término indefinido", "cond": "Periodo de prueba: 2 meses.\nDespido sin justa causa: sin preaviso, se paga la indemnización correspondiente.", "benef": "• Prima legal (1 mes de salario por año, en 2 cuotas: 30 de junio y 20 de diciembre)\n• Seguridad social (salud, pensión y riesgos laborales)\n• Vacaciones: 15 días hábiles al año (tras 1 año de servicio)\n• Auxilio de transporte de $200.000 (si aplica)", "partner": "Solvo Global", "moneda": "COP", "min": "3 días hábiles", "notas": "Aplica para todas las posiciones. Cuenta con división salarial: 65% base salarial / 35% auxilio extralegal de vivienda (la base no puede ser inferior al SMMLV).\nFecha máxima de ingreso: el 27 de cada mes por nómina (después de esa fecha requiere autorización previa)."}, {"pais": "Colombia", "tipo": "Término fijo", "cond": "Periodo de prueba: 2 meses.\nDuración máxima: 4 años (si se prorroga más, pasa a indefinido).\nSe renueva automáticamente si el empleador no avisa 30 días antes del vencimiento; el empleado también debe avisar con mínimo 30 días (salvo pacto distinto).", "benef": "• Mismas prestaciones de ley que el indefinido (prima legal, seguridad social, vacaciones)", "partner": "Solvo Global", "moneda": "COP", "min": "3 días hábiles", "notas": "Solo si el Hiring Manager lo solicita o cuenta con un aprobado para ello.\nSe usa cuando el trabajo tiene duración definida (proyectos temporales o reemplazo por licencia de maternidad)."}, {"pais": "Argentina", "tipo": "Contractor", "cond": "Único tipo de contrato que se ofrece en el país.\nPeriodo de prueba: 2 meses.\nEl cliente define calendario, objetivos y honorarios (normalmente no negociables, se comunican con claridad desde el inicio).", "benef": "Sin prestaciones legales, vacaciones reglamentarias ni bonificaciones.\n• PTO como beneficio extra: 10 días hábiles al año (después de los primeros 6 meses)", "partner": "Solvo Global", "moneda": "USD", "min": "1 día hábil", "notas": "Usar siempre \"honorarios\", nunca \"salario\" (modelo de servicios).\nPago mensual por Payoneer entre el 1.º y el 5.º día hábil; el candidato crea su propio usuario con las instrucciones de HR.\nRequiere DNI argentino. Monotributo obligatorio si la posición es presencial (opcional si es remota).\nSin exámenes médicos ni fecha máxima de ingreso."}, {"pais": "México", "tipo": "Término indefinido", "cond": "Periodo de prueba: 2 meses (60 días) para entry level; 180 días para posiciones directivas o muy técnicas.\nNo existe un plazo de preaviso legal para la rescisión del contrato.", "benef": "• IMSS (seguridad social)\n• Aguinaldo: 15 días de sueldo en diciembre (proporcional si lleva menos de 1 año)\n• Utilidades: 10% de las utilidades de la empresa, se pagan en mayo–junio (mínimo 60 días trabajados)\n• Prima dominical: 25% extra\n• Vacaciones: 12 días hábiles el 1.er año (hasta 22 desde el 6.º)", "partner": "Solvo Global", "moneda": "MXN", "min": "1 día hábil", "notas": "Cuenta con división salarial: 70% sueldo / 30% bono neto (se paga por fuera de nómina, en tarjeta adicional, sin deducciones). La remuneración indicada es bruta (\"total de percepciones\").\nAcknowledgement: se envía apenas se carga el control order. Sin exámenes médicos."}, {"pais": "México", "tipo": "Término fijo", "cond": "Se usa cuando el trabajo tiene duración definida (proyectos temporales o reemplazo por licencia de maternidad).", "benef": "• Mismas prestaciones de ley que el indefinido (IMSS, aguinaldo, utilidades, prima dominical, vacaciones)", "partner": "Solvo Global", "moneda": "MXN", "min": "1 día hábil", "notas": "Cuenta con división salarial: 70% sueldo / 30% bono neto."}, {"pais": "México", "tipo": "Contractor", "cond": "", "benef": "NA", "partner": "Solvo Global", "moneda": "USD", "min": "1 día hábil", "notas": ""}, {"pais": "Perú", "tipo": "Bajo planilla (fijo cada 3 meses)", "cond": "Planilla completa bajo el régimen general (a término fijo).\nPeriodo de prueba: 3 meses. Contratos renovables cada 3 meses.\nEl contrato se envía cuando el candidato aprueba todas las etapas de pre-hiring.", "benef": "• Seguro público cubierto 100% por Apex (si quiere EPS privada, el candidato paga la diferencia)\n• Asignación familiar (con la documentación adecuada al firmar el contrato)\n• Gratificaciones: 1 sueldo completo en julio y otro en diciembre\n• Pensión: descuento del 13% del salario bruto\n• Vacaciones: 30 días al año; se gozan 15 días hábiles tras el 1.er año y los otros 15 se pagan con el sueldo", "partner": "Apex", "moneda": "PEN", "min": "5 días hábiles", "notas": "Renovable cada 3 meses. Cuenta con división salarial: base prestacional + vale de alimentos 20% (Sodexo) + transporte S/30 por día presencial (posiciones remotas: S/200 fijos de compensación por teletrabajo).\nAl ingresar firman un documento aceptando la política de vacaciones. Feriados laborados: se pagan al triple (si no se da día compensatorio)."}, {"pais": "Perú", "tipo": "Contractor", "cond": "Periodo de prueba 2 meses", "benef": "NA", "partner": "Solvo Global", "moneda": "PEN", "min": "1 día hábil", "notas": "Remoto"}, {"pais": "Guatemala", "tipo": "Término indefinido", "cond": "Periodo de prueba: 2 meses (60 días).\nPara terminarlo debe haber justa causa o mutuo acuerdo; sin justa causa se paga indemnización.", "benef": "• IGSS (seguridad social) e IRTRA (centro recreativo)\n• Aguinaldo (salario extra en diciembre)\n• Bono 14 (salario extra en julio)\n• Vacaciones: 15 días hábiles al año (tras 1 año de servicio)\n• Parqueadero con tarifa baja (carros Q150, motos Q50)", "partner": "Allied Global", "moneda": "GTQ", "min": "3 días hábiles", "notas": "Cuenta con división salarial: 80% base salarial (se paga a fin de mes) / 20% bono de asistencia (no prestacional, sin descuentos, normalmente se paga el 15).\nMencionar la alianza con Allied desde el inicio y aclarar que no todas las posiciones son de CSR.\nAcknowledgement: se envía cuando el candidato aprueba el background check. Sin exámenes médicos."}, {"pais": "Guatemala", "tipo": "Término fijo", "cond": "Se usa cuando el trabajo tiene duración definida (proyectos temporales o reemplazo por licencia de maternidad).\nSi se renueva constantemente puede convertirse en indefinido.", "benef": "• Mismas prestaciones de ley que el indefinido (IGSS, IRTRA, aguinaldo, Bono 14, vacaciones)", "partner": "Allied Global", "moneda": "GTQ", "min": "3 días hábiles", "notas": "Cuenta con división salarial: 80% base salarial / 20% bono de asistencia."}, {"pais": "Guatemala", "tipo": "Contractor", "cond": "Periodo de prueba 2 meses", "benef": "NA", "partner": "Solvo Global", "moneda": "USD", "min": "1 día hábil", "notas": "Remoto"}, {"pais": "Honduras", "tipo": "Término indefinido", "cond": "Periodo de prueba: 2 meses (60 días).\nPara terminarlo debe haber justa causa o mutuo acuerdo; sin justa causa se paga indemnización.", "benef": "• IHSS (seguridad social)\n• Catorceavo: 1 salario mensual completo, generalmente antes del 30 de junio (proporcional si lleva menos de 1 año)\n• Aguinaldo: salarios ordinarios del año (sin horas extra ni bonificaciones) ÷ 12; proporcional si lleva menos de 1 año\n• Vacaciones: 10 días tras el 1.er año, 12 al 2.º, 15 al 3.º y 20 desde el 4.º", "partner": "Allied Global", "moneda": "HNL", "min": "Por confirmar", "notas": "Cuenta con división salarial: 80% base salarial (se paga a fin de mes) / 20% bono de asistencia (no prestacional, sin descuentos, normalmente se paga el 15).\nMencionar la alianza con Allied desde el inicio y aclarar que no todas las posiciones son de CSR.\nAcknowledgement: se envía cuando el candidato aprueba el background check. Sin exámenes médicos."}, {"pais": "Honduras", "tipo": "Término fijo", "cond": "Se usa cuando el trabajo tiene duración definida (proyectos temporales o reemplazo por licencia de maternidad).\nSi se renueva constantemente puede convertirse en indefinido.", "benef": "• Mismas prestaciones de ley que el indefinido (IHSS, catorceavo, aguinaldo, vacaciones)", "partner": "Allied Global", "moneda": "HNL", "min": "Por confirmar", "notas": "Cuenta con división salarial: 80% base salarial / 20% bono de asistencia."}, {"pais": "Kenia", "tipo": "Carta de oferta – término fijo", "cond": "Se inicia con una carta de oferta por un periodo inicial de 3 meses (periodo de prueba, ampliable a 6 meses o máximo 1 año si el empleador lo justifica).\nAl superarlo, se entrega un contrato formal por 1 año, renovable anualmente (incluye el periodo de prueba ya cumplido).", "benef": "• NSSF (protección social) y SHIF (seguro social de salud)\n• Prestaciones legales e impuesto sobre la vivienda (aplican desde el 1.er día)\n• Vacaciones: 21 días laborables al año (tras 12 meses; se pueden empezar a tomar desde el mes 3, prorrateadas)", "partner": "Oasis Outsourcing", "moneda": "KES", "min": "5 días", "notas": "Se ofrece el valor bruto mensual en moneda local (KES), antes de deducciones.\nAuxilio de transporte de 10.500 KES para todos los candidatos cuando el horario es después de las 10:00 pm (hora Kenia); se paga a fin de mes por M-Pesa (proporcional si el horario es rotativo).\nEl hire debe notificarse con mínimo 5 días de anticipación. Sin exámenes médicos."}, {"pais": "Filipinas", "tipo": "Periodo de prueba → indefinido", "cond": "Se inicia con un contrato de prueba de 6 meses. Al terminar, el candidato presenta una prueba de rendimiento y, si la supera, se le ofrece un contrato indefinido.", "benef": "• Beneficios obligatorios del gobierno (Pag-IBIG, SSS, PhilHealth, impuestos)\n• Paga extra de diciembre\n• Seguro médico, dental y de vida pagado 100% por el empleador (si cumple requisitos)\n• HMO propio tras 3 meses (+ cobertura para 1 dependiente tras la regularización)\n• Vacaciones: 20 días al año en posiciones presenciales y 10 en remotas (beneficio extra de TBPO)", "partner": "Calltek y Transparent BPO", "moneda": "PHP", "min": "Por confirmar", "notas": "Se ofrece el valor bruto mensual en pesos filipinos, antes de deducciones (100% base, sin división salarial).\nNómina semanal.\nSin Acknowledgement ni exámenes médicos.\nEl candidato queda contratado 2 días antes de la fecha de inicio formal con el cliente (onboarding); esto no cambia el start date del control order."}, {"pais": "Brasil", "tipo": "Término indefinido", "cond": "Periodo de prueba: 3 meses.", "benef": "• Vale de refrigerio, plan de salud y odontológico, seguro de vida y convenio con academias\n• 13.º salario a fin de año\n• Vale-transporte (el trabajador aporta máximo el 6% de su salario base; el empleador cubre la diferencia)\n• Vacaciones: istamos y evaluamos el perfil.": "We interview and assess the profile.", "Enviamos el perfil al POC, con el salario ya actualizado en Ceipal.": "We send the profile to the POC, with the salary already updated in Ceipal.", "Puede enviarse a otra vacante 48 h después del 1.er submittal.": "Can be sent to another opening 48 h after the first submittal.", "Envía el perfil al supervisor de operaciones.": "Sends the profile to the operations supervisor.", "Entrevista con el supervisor de Ops.": "Interview with the Ops supervisor.", "Envía el perfil al cliente.": "Sends the profile to the client.", "Entrevista con el cliente.": "Interview with the client.", "Hay oferta: vuelve al reclutador. El candidato recibe y confirma la oferta.": "There's an offer: it goes back to the recruiter. The candidate receives and confirms the offer.", "Contratado: ya no se puede enviar a otras vacantes.": "Hired: can no longer be sent to other openings.", "Último paso del proceso.": "Last step of the process.", "Sigue:": "Next:", "· aquí pasa al POC": "· hands over to the POC here", "· vuelve al reclutador": "· back to the recruiter", "¿Cuándo entró a este status?": "When did it enter this status?", "❌ Si el candidato no sigue": "❌ If the candidate doesn't continue", "Reclutador · márcalo apenas termine la entrevista": "Recruiter · mark it as soon as the interview ends", "⏸️ Si el proceso está en pausa": "⏸️ If the process is on hold", "POC · sin SLA, hay que hacerle seguimiento": "POC · no SLA, needs follow-up", "No cumple el perfil": "Doesn't fit the profile", "No se conectó y no contesta": "Didn't join and doesn't answer", "Se retiró del proceso": "Withdrew from the process", "Esperando respuesta del candidato": "Waiting for the candidate's reply", "Tiene una restricción": "Has a restriction", "Esperando feedback de Ops o cliente": "Waiting for feedback from Ops or the client", "Esperando una acción del candidato": "Waiting for an action from the candidate", "Si lleva más de 48 h en pausa, escríbele al POC.": "If it's been on hold for more than 48 h, message the POC.", "Reglas de oro": "Golden rules", "🔁 Cambia de etapa = cambia el status el mismo día": "🔁 New stage = update the status the same day", "💰 Salario en Ceipal apenas lo tengamos, antes del paso 2": "💰 Salary in Ceipal as soon as we have it, before step 2", "👀 Sin status actualizado, nadie ve avanzar al candidato": "👀 Without an updated status, nobody sees the candidate moving", "Toca cualquier status para copiar su nombre exacto.": "Tap any status to copy its exact name.", "⏱ A tiempo": "⏱ On time", "⚠️ SLA vencido": "⚠️ SLA missed", "Clientes nuevos": "New clients", "Follow up con el cliente": "Client follow-up", "1. ¿Cuándo completaste la terna?": "1. When did you complete the shortlist?", "El día que enviaste el 3.er candidato": "The day you sent the 3rd candidate", "Fecha en que se completó la terna": "Date the shortlist was completed", "Cliente (nombre)": "Client (name)", "Cargo": "Role", "Candidatos enviados · uno por línea": "Candidates sent · one per line", "Tu firma": "Your signature", "Correo del cliente (opcional)": "Client email (optional)", "2. ¿Qué toca?": "2. What's next?", "3. Tu correo": "3. Your email", "Asunto": "Subject", "Cuerpo": "Body", "Copiar correo": "Copy email", "Copiar asunto": "Copy subject", "Abrir en mi correo ↗": "Open in my email ↗", "Reglas": "Rules", "Toca una para leerla": "Tap one to read it", "Final": "Final", "Seguimiento 1": "Follow-up 1", "Seguimiento 2": "Follow-up 2", "Seguimiento 3": "Follow-up 3", "Seguimiento 4": "Follow-up 4", "Seguimiento 5": "Follow-up 5", "Seguimiento 6": "Follow-up 6", "Seguimiento 7": "Follow-up 7", "Aviso al VP de Ventas": "Notify the VP of Sales", "Consenso sobre cómo proceder": "Agree on how to proceed", "Aviso final al cliente": "Final notice to the client", "Candidatos mínimos para iniciar": "Minimum candidates to start", "Canales y responsable": "Channels and owner", "Frecuencia y duración": "Frequency and duration", "Respuestas del cliente": "Client replies", "Límite de 5 candidatos": "5-candidate limit", "Cliente de vacaciones / PTO / fuera de oficina": "Client on vacation / PTO / out of office", "Tiempo de respuesta de TA": "TA response time", "Los reclutadores deben enviar 3 candidatos por posición (si el cliente solicita 2 o más vacantes) y máximo 5 candidatos por posición (si solicita solo 1 vacante) para iniciar el proceso de follow up.": "Recruiters must send 3 candidates per position (if the client requests 2 or more openings) and up to 5 candidates per position (if only 1 opening is requested) to start the follow-up process.", "Todas las comunicaciones de seguimiento las envía TA, a través del Especialista de Activación de Clientes a cargo del cliente, en este orden: 1) llamada; 2) si no contesta, correo; 3) finalmente, un SMS con el resumen del último correo enviado.": "All follow-up communication is sent by TA, through the Client Activation Specialist in charge of the client, in this order: 1) call; 2) if there's no answer, email; 3) finally, a text message summarizing the last email sent.", "Cada contacto se hace como muestra el calendario: unos cada 48 horas y otros cada 72 horas. Desde el envío del 1.er candidato, todo el proceso de follow up y el aviso final de cancelación de la requisición toma 22 días hábiles.": "Each contact follows the calendar: some every 48 hours and others every 72 hours. From the first candidate sent, the whole follow-up process through the final cancellation notice takes 22 business days.", "Si el cliente responde a nuestros correos, debe ser un feedback concreto sobre los candidatos presentados. Respuestas como \"estamos revisando\", \"gracias, lo reviso\", \"quedamos atentos\", \"les escribimos pronto\" cuentan como respuesta, pero no como la que necesitamos para saber si el pipeline avanza. En esos casos NO se inicia el proceso de follow up: el Especialista de Activación de Clientes llama ese mismo día al Implementation Manager para darle visibilidad de las respuestas y al día siguiente llama al cliente para hacer seguimiento a los próximos pasos con base en los primeros candidatos enviados.": "If the client replies to our emails, it must be concrete feedback on the candidates presented. Replies like \"we're reviewing\", \"thanks, I'll take a look\", \"we'll get back to you\" count as a reply, but not the kind we need to know whether the pipeline is moving. In those cases the follow-up process does NOT start: the Client Activation Specialist calls the Implementation Manager that same day to share the replies, and the next day calls the client to follow up on next steps based on the first candidates sent.", "Si ya se enviaron 5 candidatos al cliente y este no responde, sin importar en qué número de seguimiento estemos, se dejan de enviar candidatos nuevos hasta recibir feedback de los pendientes.": "If 5 candidates have already been sent and the client doesn't reply, no matter which follow-up we're on, we stop sending new candidates until we get feedback on the pending ones.", "El contador de seguimientos se detiene. De acuerdo con Ventas y el Implementation Manager se toma una de estas rutas: 1) intentar contactar a un segundo punto de contacto de respaldo que indique el contacto principal; 2) si no hay respaldo, poner la posición en hold hasta que el cliente regrese. La reactivación es responsabilidad del Especialista de Activación de Clientes.": "The follow-up count pauses. Together with Sales and the Implementation Manager, one of these routes is taken: 1) try a backup point of contact named by the main contact; 2) if there's no backup, put the position on hold until the client is back. Reactivation is the Client Activation Specialist's responsibility.", "El equipo de TA se compromete a responder al cliente en máximo 3 horas hábiles: agendamiento de entrevistas de candidatos, preguntas y feedback en general.": "The TA team commits to replying to the client within 3 business hours at most: <script>
const DATA=JSON.parse(document.getElementById('cos-data').textContent);
const EN=JSON.parse(document.getElementById('cos-en').textContent);
const TABS=[['proceso','Proceso'],['ceipal','CEIPAL'],['qa','Candidatos QA'],['novedades','Novedades'],['status','Status CEIPAL'],['sla','SLA Prehiring'],['ingreso','Fecha de ingreso'],['plantillas','Plantillas'],['funnels','Funnels'],['objeciones','Objeciones'],['followup','Follow up'],['jd','JD → Mensajes'],['entrevista','JD → Entrevista'],['contactar','Mejor hora'],['contratos','Contratos'],['salarios','Salarios'],['peru','Salario Perú'],['pagos','Pagos'],['sups','Supervisores'],['sites','Sites'],['links','Links'],['accesos','Accesos'],['horarios','Horarios']];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const lines=t=>String(t||'').split(/\n+/).map(l=>l.replace(/^\s*[•\-*·]\s*/,'').trim()).filter(Boolean);
const store={get(k,d){try{const v=localStorage.getItem('cositas_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('cositas_'+k,JSON.stringify(v))}catch(e){}}};
/* ---- Idioma ---- */
let LANG=store.get('lang','es');document.documentElement.lang=LANG;
const L=(es,en)=>LANG==='en'?en:es;
const LOC=()=>LANG==='en'?'en-US':'es-CO';
const CTRY={'Filipinas':'Philippines','Sudáfrica':'South Africa','España':'Spain','Belice':'Belize','Brasil':'Brazil','Kenia':'Kenya','México':'Mexico','Perú':'Peru'};
const trc=x=>CTRY[x]||x;
const tr=x=>LANG==='en'&&x!=null?(EN[x]??EN[String(x).trim()]??x):x;
const PATS=[
  [/^(.*), (Filipinas|Sudáfrica|España|Belice|Brasil|Kenia|México|Perú)$/,m=>`${m[1]}, ${trc(m[2])}`],
  [/^(\S+) (Kenia|México|Perú|Filipinas)$/u,m=>`${m[1]} ${trc(m[2])}`],
  [/^Total mensual · (.+)$/,m=>`Monthly total · ${trc(m[1])}`],[/^Total · (.+)$/,m=>`Total · ${tr(m[1])}`],
  [/^en (\d+) días?$/,m=>`in ${m[1]} day${m[1]==='1'?'':'s'}`],[/^hace (\d+) días?$/,m=>`${m[1]} days ago`],
  [/^(\d+) (días|meses|días hábiles|horas)(.*)$/,m=>`${m[1]} ${({'días':'days','meses':'months','días hábiles':'business days','horas':'hours'})[m[2]]}${m[3].replace(/días/g,'days').replace(/para entry level/,'for entry level')}`],
  [/^Copiado: ([\s\S]*)$/,m=>`Copied: ${m[1]}`],[/^Resultados para “(.*)”$/,m=>`Results for “${m[1]}”`],
  [/^(Fuerte|Regular|Débil) (\d+)$/,m=>`${EN[m[1]]} ${m[2]}`],
  [/^(Cargo|Modalidad|Horario|Inglés|Funciones|Requisitos|Beneficios|Ubicación|Salario): (.*)$/,m=>`${EN[m[1]]||m[1]}: ${m[2]==='no detectado'?'not detected':m[2].replace(/(\d+) detectad[oa]s/,'$1 detected').replace(/^(Remoto|Híbrido|Presencial)$/,x=>EN[x])}`],
  [/^Mi expectativa salarial para esta posición es de (.+)\.$/,m=>`My salary expectation for this position is ${m[1]}.`],
  [/^Supera el (salario base|total \(base \+ bonos\)) del nivel (\w+) \((.+)\)\.$/,m=>`Above the ${m[1]==='salario base'?'base salary':'total (base + bonuses)'} for level ${m[2]} (${m[3]}).`],
  [/^Está dentro del (salario base|total \(base \+ bonos\)) desde el nivel JR \((.+)\)\.$/,m=>`Within the ${m[1]==='salario base'?'base salary':'total (base + bonuses)'} from level JR (${m[2]}).`],
  [/^Para cubrirla con el (salario base|total \(base \+ bonos\)) se necesita nivel (\w+) \((.+)\) o superior\.$/,m=>`To cover it with the ${m[1]==='salario base'?'base salary':'total (base + bonuses)'}, level ${m[2]} (${m[3]}) or higher is needed.`],
  [/^La mejor hora empieza en (.+) \((.+) en Colombia\)$/,m=>`The best time starts in ${m[1]} (${m[2]} in Colombia)`],[/^Quedan (.+) de la mejor franja$/,m=>`${m[1]} left in the best window`],
  [/^Usuario (\w+) · ahora \((.+)\)$/,m=>`${m[1]}'s account · now (${m[2]})`],
  [/^(hasta las |Sigue: )/,m=>null,x=>x.replace(/hasta las/,'until').replace(/Sigue:/,'Next:').replace(/ a las /g,' at ')],
  [/^Seguimiento (\d)(.*)$/,m=>`Follow-up ${m[1]}${m[2]}`],[/^Alerta interna (\d)$/,m=>`Internal alert ${m[1]}`],
  [/^(\d+) sites en$/,m=>`${m[1]} sites in`],[/^⏱ (.+)$/,m=>EN[m[1]]?`⏱ ${EN[m[1]]}`:null]
];
function trStr(t){
  if(LANG!=='en'||!t)return null;const k=t.trim();if(!k)return null;
  let v=EN[k];
  if(v==null)for(const [re,f,g] of PATS){const m=k.match(re);if(m){v=g?g(k):f(m);break}}
  if(v==null||v===k)return null;return t.replace(k,v);
}
const TR_ATTRS=['placeholder','title','aria-label'];const TR_ORIG=new Map(),TR_AORIG=[];
function trRoot(root){
  if(LANG!=='en'||!root)return;
  if(root.nodeType===3){const v=trStr(root.nodeValue);if(v!=null){if(!TR_ORIG.has(root))TR_ORIG.set(root,root.nodeValue);root.nodeValue=v}return}
  if(root.nodeType!==1)return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('script,style,textarea,[data-notr]')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];let n;while(n=tw.nextNode())nodes.push(n);
  nodes.forEach(n=>{const v=trStr(n.nodeValue);if(v!=null){if(!TR_ORIG.has(n))TR_ORIG.set(n,n.nodeValue);n.nodeValue=v}});
  [root,...root.querySelectorAll('[placeholder],[title],[aria-label]')].forEach(el=>{if(!el.getAttribute)return;TR_ATTRS.forEach(a=>{const o=el.getAttribute(a);if(o){const v=trStr(o);if(v!=null){TR_AORIG.push([el,a,o]);el.setAttribute(a,v)}}})});
}
let TR_OBS=null;
function trStart(){if(TR_OBS)return;TR_OBS=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')trRoot(m.target);else m.addedNodes.forEach(trRoot);if(m.type==='attributes')trRoot(m.target)}});
  TR_OBS.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TR_ATTRS})}
if(LANG==='en'){trStart();trRoot(document.body)}
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,3000)}
async function copy(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'Copiado.')}catch(e){openSheet(`<h2>Copia este texto</h2><textarea class="out" id="cpy">${esc(t)}</textarea><div class="actions"><button class="btn" data-close>Cerrar</button></div>`);const a=$('cpy');a.focus();a.select()}}
function openSheet(h){$('sheet').innerHTML=h;$('scrim').hidden=false}
function closeSheet(){$('scrim').hidden=true;$('sheet').innerHTML=''}
$('scrim').addEventListener('click',e=>{if(e.target.id==='scrim'||e.target.closest('[data-close]'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('scrim').hidden)closeSheet()});
const ext=u=>u?`<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">Abrir ↗</a>`:'<span class="pill">Sin link</span>';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>new Date(s+'T12:00');
const fmtD=d=>d.toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'short'});
function addBiz(d,n){const x=new Date(d);while(n>0){x.setDate(x.getDate()+1);if(x.getDay()!==0&&x.getDay()!==6)n--}return x}
function bizBetween(a,b){let n=0;const x=new Date(a);while(iso(x)<iso(b)){x.setDate(x.getDate()+1);if(x.getDay()!==0&&x.getDay()!==6)n++}return n}
const money=(n,cur)=>new Intl.NumberFormat(LOC(),{maximumFractionDigits:0}).format(Math.round(n))+(cur?' '+cur:'');

/* ================== Vistas ================== */
const V={};

function slaShort(t){const n=norm(t);
  if(n.includes('primer dia habil'))return 'Día 1 hábil';if(n.includes('inmediatamente'))return 'Inmediato';if(n.includes('segun'))return 'Según pipeline';
  if(n.includes('1 a 2 dias'))return '1–2 días hábiles';if(n.includes('24 horas'))return '24 h';if(n.includes('1 dia habil'))return '1 día hábil';return t?t.split(/[.,]/)[0]:'—'}

        <div class="prot">${C.prot.map(p=>{const h=PROT_H[norm(p.sit)]??0;const lbl=h===0?'Libre':h>=168?'7 días hábiles':h+' horas';const w=h===0?18:Math.min(100,18+h/168*82);
          return `<div class="protrow"><span title="${esc(p.prot)}">${esc(p.sit)}</span><span class="protbar" style="width:${w}%;background:${h?'var(--warn)':'var(--ok)'}">${lbl}</span></div>`}).join('')}</div></section>

function ceipalCheck(){
  const out=$('ckOut');if(!out)return;
  const e=$('ckExists').value,a=$('ckActive').value,l=$('ckLast').value;
  const showDate=e==='si'&&a==='no'&&!['none','hired'].includes(l);
  $('ckDate').parentElement.hidden=!showDate;$('ckTime').parentElement.hidden=!showDate;
  $('ckActive').parentElement.hidden=e==='no';$('ckLast').parentElement.hidden=e==='no';
  let cls='ok',big=tr('Disponible'),txt='';
  if(e==='no'){big=tr('Créalo en CEIPAL');txt=tr('No existe: crea el perfil completo y déjalo documentado con una nota de seguimiento.')}
  else if(a==='si'){cls='crit';big=tr('No continuar');txt=tr('Tiene un proceso o submittal activo. No se puede continuar con el candidato.')}
  else if(l==='none'){txt=tr('Sin notas registradas: está disponible para cualquier TA o sourcer.')}
  else if(l==='hired'){cls='crit';big=tr('Ya fue contratado');txt=tr('Tiene la nota Hired.')}
  else{
    const at=new Date(($('ckDate').value||iso(new Date()))+'T'+($('ckTime').value||'09:00'));
    let until,why;
    if(l==='fc'){until=new Date(at.getTime()+24*3600e3);why=L('First Contact sin respuesta: 24 horas de protección.','First Contact with no reply: 24 hours of protection.')}
    else if(l==='int'){until=new Date(at.getTime()+48*3600e3);why=L('Entrevista agendada: 48 horas de protección hasta registrar feedback.','Interview scheduled: 48 hours of protection until feedback is logged.')}
    else if(l==='sub'){until=addBiz(at,7);why=L('Entrevista o submittal registrado: 7 días hábiles de protección para el TA owner.','Interview or submittal logged: 7 business days of protection for the TA owner.')}
    else{until=new Date(at.getTime()+7*24*3600e3);why=L('Más de una semana sin actualización vuelve a quedar disponible.','After more than a week without updates, the candidate is available again.')}
    const now=new Date();
    if(now<until){cls='warn';big=tr('Protegido');txt=`${why} ${L('Libre desde el','Free from')} ${until.toLocaleString(LOC(),{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}.`}
    else txt=`${why} ${L('Ese plazo ya venció.','That period has already ended.')}`;
  }
  out.innerHTML=`<div class="verdict ${cls}"><span class="big">${big}</span><span>${esc(txt)}</span></div>`;
}

let XLSXlib=null;
function loadXLSX(){return XLSXlib?Promise.resolve(XLSXlib):new Promise((ok,ko)=>{if(window.XLSX){XLSXlib=window.XLSX;return ok(XLSXlib)}
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>{XLSXlib=window.XLSX;ok(XLSXlib)};s.onerror=ko;document.head.appendChild(s)})}
async function fnImport(file){
  try{
    const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:'array'});const out=[];
    wb.SheetNames.forEach(n=>{const rows=X.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null});
      const lab=r=>String((r&&r[1])||'').replace(/ /g,' ').trim(),num=v=>typeof v==='number'&&isFinite(v)?Math.round(v):0;
      if(!rows.some(r=>lab(r)==='Screened candidates'))return;
      const f={name:n.trim(),et:{screened:0,ta:0,ops:0,hired:0},scr:[],tad:[],src:[]};let sec=null;
      rows.forEach(r=>{const l=lab(r);if(!l)return;
        if(l==='Screened candidates')f.et.screened=num(r[2]);else if(l==='TA Interview')f.et.ta=num(r[2]);else if(l==='Candidates sent to Ops Int')f.et.ops=num(r[2]);else if(l==='Hired')f.et.hired=num(r[2]);
        else if(/^Screening Drop off/i.test(l))sec='scr';else if(/^TA Drop off/i.test(l))sec='tad';else if(/^Hiring sources/i.test(l))sec='src';
        else if(sec&&!/^(Job Portals|Ratio|TTPUT|TA Conversion)$/i.test(l))f[sec].push([l,num(r[2])])});
      out.push(f)});
    if(!out.length){toast(L('No encontré hojas de funnel en ese archivo.','No funnel sheets found in that file.'));return}
    FN.list=out;FN.sel=0;FN.fecha=new Date().toLocaleDateString(LOC(),{day:'numeric',month:'short',year:'numeric'});out.forEach(f=>f.fecha=FN.fecha);fnSave();renderFN();
    toast(L(`Cargué ${out.length} funnel(s): ${out.map(f=>f.name).join(', ')}.`,`Loaded ${out.length} funnel(s): ${out.map(f=>f.name).join(', ')}.`));
  }catch(err){toast(L('No pude leer el Excel. Revisa tu conexión e intenta de nuevo.','Couldn\'t read the Excel. Check your connection and try again.'))}
}

    <div class="actions full"><button class="btn primary" type="submit">${L('Agregar','Add')}</button><button class="btn" type="button" data-close>${L('Cancelar','Cancel')}</button></div></form>`);

const ING={...{pais:'Colombia',tipo:'',extra:'0'},...store.get('ing',{}),fecha:''};
const CORTE={Colombia:27,Brasil:25};
const habil=d=>d.getDay()!==0&&d.getDay()!==6;
function sumarDias(desde,n,habiles){const d=new Date(desde);let k=0;while(k<n){d.setDate(d.getDate()+1);if(!habiles||habil(d))k++}if(habiles)while(!habil(d))d.setDate(d.getDate()+1);return d}
const primerHabilMesSig=d=>{const x=new Date(d.getFullYear(),d.getMonth()+1,1);while(!habil(x))x.setDate(x.getDate()+1);return x};
const fLarga=d=>d.toLocaleDateString(LOC(),{weekday:'long',day:'numeric',month:'long',year:'numeric'});
V.ingreso=()=>`<div class="pagehead"><div class="meta"><span class="eyebrow">${L('Oferta aceptada → primer día','Offer accepted → first day')}</span><h1>${L('Calculadora de fecha de ingreso','Start date calculator')}</h1>

  </div></section>
  <div id="inOut"></div>`;
function renderING(){
  if(!$('inOut'))return;
  const tipos=DATA.contratos.filter(c=>c.pais===ING.pais);
  if(!tipos.some(c=>c.tipo===ING.tipo))ING.tipo=(tipos[0]||{}).tipo||'';
  $('inTipo').innerHTML=tipos.map(c=>`<option${c.tipo===ING.tipo?' selected':''}>${esc(c.tipo)}</option>`).join('');
  if(!ING.fecha)ING.fecha=isoD(new Date());
  if($('inFecha').value!==ING.fecha)$('inFecha').value=ING.fecha;
  const c=tipos.find(x=>x.tipo===ING.tipo)||{};
  const m=String(c.min||'').match(/(\d+)\s*d[ií]as?(\s*h[aá]bil)?/i);
  const base=ymd(ING.fecha);
  const notas=String((c.notas||'')+'\n'+(c.cond||'')).split('\n').map(x=>x.trim()).filter(x=>/ex[aá]men|acknowledgement|ingreso|prueba|notific/i.test(x));
  const reglas=notas.length?`<section class="panel"><h2>${L('Ten en cuenta para','Keep in mind for')} ${esc(ING.pais)} · ${esc(ING.tipo)}</h2><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">${notas.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
    <button class="linkbtn" type="button" data-goto="contratos">${L('Ver todo en Contratos','See everything in Contracts')} →</button></section>`:'';
  if(!m||!base){
    $('inOut').innerHTML=`<div class="verdict warn"><span class="big">${L('Días mínimos por confirmar','Minimum days to be confirmed')}</span><span>${L('Para este país aún no tenemos los días mínimos de anticipación. Confírmalos con HR antes de dar una fecha.','We don\'t have the minimum notice days for this country yet. Confirm with HR before giving a date.')}</span></div>${reglas}`;return}
  const n=+m[1],hab=!!m[2],extra=Math.max(0,parseInt(ING.extra,10)||0);
  let d=sumarDias(base,n,hab);if(extra)d=sumarDias(d,extra,true);
  while(!habil(d))d.setDate(d.getDate()+1);
  const corte=CORTE[ING.pais];let aviso='';
  if(corte&&d.getDate()>corte){const sig=primerHabilMesSig(d);
    aviso=`<div class="verdict warn"><span class="big">${L('Pasa del corte del','Past the cut-off on day')} ${corte}</span><span>${L(`En ${ING.pais} la fecha máxima de ingreso es el ${corte} de cada mes. Para entrar el ${fLarga(d)} se necesita autorización previa; si no, la siguiente fecha es el`,`In ${ING.pais} the latest start date is the ${corte}th of each month. Starting on ${fLarga(d)} needs prior approval; otherwise the next date is`)} <b>${fLarga(sig)}</b>.</span></div>`}
  else if(corte){const lim=new Date(d.getFullYear(),d.getMonth(),corte);
    aviso=`<p class="note">${L(`Corte de nómina: ingreso a más tardar el ${fLarga(lim)}.`,`Payroll cut-off: start no later than ${fLarga(lim)}.`)}</p>`}
  const linea=`${L('Fecha de ingreso más pronta','Earliest start date')}: ${fLarga(d)} (${ING.pais} · ${ING.tipo})`;
  $('inOut').innerHTML=`<section class="panel"><div class="ingout">
      <div class="stack" style="gap:4px"><span class="eyebrow">${L('Fecha más pronta','Earliest date')}</span><span class="datebig">${esc(fLarga(d))}</span>
        <span class="muted small">${L('Aceptó el','Accepted on')} ${esc(fLarga(base))} + ${n} ${hab?L('días hábiles','business days'):L('días calendario','calendar days')}${extra?` + ${extra} ${L('hábiles extra','extra business days')}`:''}</span></div>
      <div class="stack" style="gap:8px;align-self:center"><button class="btn" type="button" data-copy="${esc(linea)}">${L('Copiar fecha','Copy date')}</button></div></div>
    ${aviso}<p class="muted small">${L('Los días hábiles son de lunes a viernes y no descuentan festivos. Si la fecha cae en festivo, pásala al siguiente día hábil.','Business days are Monday to Friday and holidays are not skipped. If the date is a holiday, move it to the next business day.')}</p></section>${reglas}`;
}

function renderTPL(){
  if(!$('tplList'))return;
  $('tplList').innerHTML=TPL.map(t=>`<button class="tplb" type="button" data-tpl="${t.k}" aria-pressed="${t.k===TP.k}"><b>${esc(tr(t.n))}</b><span>${esc(tr(t.d))}</span></button>`).join('');
  const lang=TP.lang||LANG;
  $('tplOpts').innerHTML=`<button class="chip" data-tpch="wa" aria-pressed="${TP.ch==='wa'}">WhatsApp</button><button class="chip" data-tpch="mail" aria-pressed="${TP.ch==='mail'}">${L('Correo','Email')}</button>
    <button class="chip" data-tplang="es" aria-pressed="${lang==='es'}">ES</button><button class="chip" data-tplang="en" aria-pressed="${lang==='en'}">EN</button>`;
  const t=TPL.find(x=>x.k===TP.k),usa=JSON.stringify(t);

  tplOut();

/* --- SLA de Prehiring --- */
const SLA_PH=[['Envío de órdenes y New Hire Alert',4],['Cambios en las órdenes',4],['Agendamiento a exámenes médicos',3],['Revisión de Company Change',24],['Cancelación de órdenes',6],['Placements en CEIPAL',24,'desde la confirmación del supervisor'],
  ['Correcciones en Confirmations',4],['Reingresos Colombia',3],['Creación de usuarios en CEIPAL',4],['Cambios en posiciones',4],['Creación de posiciones',4],['Posiciones en estado Completed',3]];
const SLA={sel:store.get('slasel',0),f:0,at:'',ini:store.get('slaini','08:00'),fin:store.get('slafin','17:00')};
V.sla=()=>`<div class="pagehead"><div class="meta"><span class="eyebrow">Prehiring · tiempos de respuesta</span><h1>SLA de Prehiring</h1></div>
  <div class="legend"><span class="slah h3">3 h</span><span class="slah h4">4 h</span><span class="slah h6">6 h</span><span class="slah h24">24 h</span></div></div>
  <section class="panel"><div class="panel-head"><h2>Procesos</h2><span class="muted small">Toca uno para calcular cuándo vence</span></div>
    <div class="slafil" id="slaFil"></div><div class="slagrid" id="slaGrid"></div></section>
  <section class="panel"><div class="panel-head"><h2>¿Cuándo debe estar listo?</h2><span class="muted small" id="slaName"></span></div>
    <div class="slacalc">
      <label>¿Cuándo lo solicitaste o enviaste?<input type="datetime-local" id="slaAt"></label>
      <label>Jornada hábil (lunes a viernes)<span class="slajor"><input type="time" id="slaIni" value="${esc(SLA.ini)}" aria-label="Inicio de jornada"><span>a</span><input type="time" id="slaFin" value="${esc(SLA.fin)}" aria-label="Fin de jornada"></span></label>
    </div>
    <div class="slaout" id="slaOut"></div>
    <p class="muted small" style="margin-top:10px">Solo cuenta horas hábiles: de lunes a viernes dentro de la jornada. No descuenta festivos.</p></section>`;
const hmToMin=t=>{const [h,m]=String(t||'').split(':').map(Number);return (h||0)*60+(m||0)};
function sumarHabiles(desde,horas){
  const ini=hmToMin(SLA.ini),fin=hmToMin(SLA.fin);if(fin<=ini)return null;
  let d=new Date(desde),rest=horas*60;
  for(let i=0;i<400;i++){
    const dow=d.getDay(),m=d.getHours()*60+d.getMinutes();
    if(dow===0||dow===6||m>=fin){d.setDate(d.getDate()+1);d.setHours(Math.floor(ini/60),ini%60,0,0);continue}
    if(m<ini){d.setHours(Math.floor(ini/60),ini%60,0,0);continue}
    const disp=fin-m;
    if(rest<=disp){d.setMinutes(d.getMinutes()+rest);return d}
    rest-=disp;d.setDate(d.getDate()+1);d.setHours(Math.floor(ini/60),ini%60,0,0);
  }
  return null;
}
function habilesEntre(a,b){ // minutos hábiles entre a y b
  const ini=hmToMin(SLA.ini),fin=hmToMin(SLA.fin);let d=new Date(a),tot=0;
  for(let i=0;i<400&&d<b;i++){
    const dow=d.getDay(),m=d.getHours()*60+d.getMinutes();
    const next=new Date(d);next.setDate(next.getDate()+1);next.setHours(Math.floor(ini/60),ini%60,0,0);
    if(dow===0||dow===6||m>=fin){d=next;continue}
    if(m<ini){d.setHours(Math.floor(ini/60),ini%60,0,0);continue}
    const finDia=new Date(d);finDia.setHours(Math.floor(fin/60),fin%60,0,0);
    const hasta=b<finDia?b:finDia;tot+=Math.max(0,(hasta-d)/60000);d=next;
  }
  return tot;
}
function renderSLA(){
  if(!$('slaGrid'))return;
  const hs=[0,3,4,6,24];
  $('slaFil').innerHTML=hs.map(h=>`<button class="chip" data-slaf="${h}" aria-pressed="${SLA.f===h}">${h?h+' h':L('Todos','All')}</button>`).join('');
  $('slaGrid').innerHTML=SLA_PH.map(([t,h,x],i)=>SLA.f&&SLA.f!==h?'':`<button class="slab" data-sla="${i}" aria-pressed="${i===SLA.sel}"><span>${esc(t)}${x?`<small>${esc(x)}</small>`:''}</span><span class="slah h${h}">${h} ${L('h hábiles','business h')}</span></button>`).join('');
  if(!SLA.at){const n=new Date();n.setSeconds(0,0);SLA.at=new Date(n-n.getTimezoneOffset()*6e4).toISOString().slice(0,16)}
  if($('slaAt').value!==SLA.at)$('slaAt').value=SLA.at;
  slaCalc();
}
function slaCalc(){
  const [t,h,x]=SLA_PH[SLA.sel];
  $('slaName').textContent=`${t} · ${h} ${L('horas hábiles','business hours')}`;
  const out=$('slaOut');
  if(!SLA.at){out.innerHTML='';return}
  const due=sumarHabiles(new Date(SLA.at),h);
  if(!due){out.innerHTML=`<div class="status no">${L('Revisa la jornada: la hora de fin debe ser mayor que la de inicio.','Check the work hours: the end time must be after the start time.')}</div>`;return}
  const now=new Date(),late=due<now;
  const quedan=late?0:habilesEntre(now,due),qh=Math.floor(quedan/60),qm=Math.round(quedan%60);
  const fecha=due.toLocaleString(LOC(),{weekday:'long',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  out.innerHTML=`<div class="status ${late?'no':(quedan<=60?'wait':'ok')}">${late?L('⚠️ SLA vencido','⚠️ SLA missed'):(quedan<=60?L('⏳ Vence pronto','⏳ Due soon'):L('⏱ A tiempo','⏱ On time'))}
    <span class="big">${L('Vence','Due')}: ${esc(fecha)}</span>
    <small>${late?L('Ya pasó el tiempo de respuesta.','The response time has passed.'):`${L('Quedan','Remaining')}: ${qh?qh+' h ':''}${qm} min ${L('hábiles','business time')}`}${x?' · '+esc(x):''}</small></div>`;
}

function buildQs(){

  m.resp.slice(0,5).forEach(r=>add(en?'Role responsibilities':'Responsabilidades del rol',en?`This role includes "${r}". Tell me about a time you did this: what did you do and what was the result?`:`El rol incluye "${r}". Cuéntame de una vez en la que lo hiciste: ¿qué hiciste y qué resultado obtuviste?`,en?'Look for a concrete example (situation, action, result).':'Busca un ejemplo concreto: situación, acción y resultado.'));
  m.reqs.filter(r=>!/ingl[eé]s|english/i.test(r)).slice(0,4).forEach(r=>{const y=r.match(/(\d+)\s*\+?\s*(a[ñn]os|years?)/i);
    add(en?'Requirements':'Requisitos',y?(en?`The role asks for ${y[1]}+ years: "${r}". How many years do you have and in what roles?`:`El cargo pide ${y[1]}+ años: "${r}". ¿Cuántos años tienes y en qué cargos?`):(en?`The role requires "${r}". How do you meet this? Give me a specific example.`:`El cargo pide "${r}". ¿Cómo cumples con esto? Dame un ejemplo concreto.`),en?'Validates a must-have.':'Valida un requisito indispensable.')});

  add(en?'English check':'Parte en inglés','Can you describe your current or last job and a typical day there?',en?'Fluency and vocabulary.':'Fluidez y vocabulario. Hazla en inglés.');
  add(en?'English check':'Parte en inglés','Tell me about a challenge you faced at work and how you solved it.',m.eng?(en?`Target level: ${m.eng}.`:`Nivel esperado: ${m.eng}.`):(en?'Structure and grammar.':'Estructura y gramática.'));
  if(m.sched)add(en?'Conditions':'Condiciones',en?`The schedule is ${m.sched}. Does that work for you?`:`El horario es ${m.sched}. ¿Te funciona?`,'');
  if(m.mod==='Presencial'||m.mod==='Híbrido')add(en?'Conditions':'Condiciones',en?`The role is ${m.mod==='Presencial'?'on-site':'hybrid'}. How would you commute to the office?`:`El rol es ${m.mod.toLowerCase()}. ¿Cómo te desplazarías a la oficina?`,'');
  add(en?'Conditions':'Condiciones',en?'When could you start?':'¿Cuál es tu disponibilidad para iniciar?','');
  add(en?'Conditions':'Condiciones',en?'What is your salary expectation?':'¿Cuál es tu expectativa salarial?',en?'Log it in Ceipal before the POC submission.':'Regístrala en Ceipal antes del TA POC Submission.');
  return Q;
}

Después de la entrevista: actualiza el status (TA Review → TA POC Submission en máximo 4 h) y deja la nota en Ceipal.`;

const PE=store.get('pe',{total:2000,mod:'6',rmv:1130});
const PE_MODS=[['6','6 días oficina'],['5','5 días'],['4','4 días'],['3','3 días'],['2','2 días'],['1','1 día'],['h','Home office']];
function peSplit(total,mod,rmv){
  const T=mod==='h'?200:(+mod)*4*30, R=total-T;
  let base,food;
  const x=R/1.2,f=R-R/1.2;
  if(x<rmv)base=rmv;else if(R*0.2>2*rmv)base=null;else base=x;
  if(f>2*rmv)food=2*rmv;else if(f<rmv)food=null;else food=f;
  if(base==null)base=total-food-T;
  base=Math.ceil(base-1e-9);
  if(food==null)food=total-base-T;
  food=Math.floor(food+1e-9);
  return {T,base,food,R};
}

function supLevels(){if(SUP.esq==='local'){const r=SUP_LOCAL[SUP.pais];return {cur:r[0],lv:r.slice(1)}}return {cur:'USD',lv:SUP_CONTR[SUP.pais]}}

async function exportPage(){
  const doc=document.documentElement.cloneNode(true);
  doc.querySelector('#cos-data').textContent=JSON.stringify(DATA).replace(/<\//g,'<\\/');
  doc.querySelectorAll('head script').forEach(x=>x.remove());
  if(!doc.querySelector('head meta[charset]'))doc.querySelector('head').insertAdjacentHTML('afterbegin','<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">');
  const clr=sel=>{const el=doc.querySelector(sel);if(el)el.innerHTML=''};
  clr('#main');clr('#sheet');clr('#drawer');clr('#curTab');
  ['#scrim','#dscrim','#toast'].forEach(sel=>{const el=doc.querySelector(sel);if(el)el.setAttribute('hidden','')});
  doc.querySelector('#menuBtn')&&doc.querySelector('#menuBtn').setAttribute('aria-expanded','false');
  doc.removeAttribute('lang');
  const html='<!doctype html>\n'+doc.outerHTML,filename='index.html';
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename,data:html});return}}catch(e){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();toast(L('Página descargada como index.html.','Page downloaded as index.html.'))}
  catch(e){toast(L('No se pudo descargar aquí.','Couldn\'t download here.'))}
}

const CT=[
  {p:'Colombia',tz:'America/Bogota',best:[[600,840]],avoid:[[480,540],[1200,1440]],rate:'62–65%',r:63.5,tip:'Pico cerca de la 1:00 p. m.',bt:'10:00 a. m. – 2:00 p. m.',at:'8:00–9:00 a. m. y después de las 8:00 p. m.'},
  {p:'Kenia',tz:'Africa/Nairobi',best:[[480,600]],avoid:[[900,1200]],rate:'88–99%',r:93.5,bt:'8:00 – 10:00 a. m.',at:'Desde las 3:00 p. m. (hasta las 8:00 p. m.)'},
  {p:'Argentina',tz:'America/Argentina/Buenos_Aires',best:[[720,1140]],avoid:[[1200,1440],[0,240]],rate:'93%',r:93,bt:'12:00 – 7:00 p. m.',at:'8:00 p. m. – 4:00 a. m.'},
  {p:'México',tz:'America/Mexico_City',best:[[660,780]],avoid:[[840,900]],rate:'47%',r:47,tip:'2:00 p. m. es su hora de comida',bt:'11:00 a. m. – 1:00 p. m.',at:'2:00 p. m. (hora de comida)'},
  {p:'Perú',tz:'America/Lima',best:[[720,840],[1080,1140]],avoid:[],rate:'77–84%',r:80.5,bt:'12:00 – 2:00 p. m. y 6:00 p. m.',at:''}];
const tzMin=tz=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());return (+p.find(x=>x.type==='hour').value%24)*60+(+p.find(x=>x.type==='minute').value)};
const inR=(m,rs)=>rs.some(([a,b])=>m>=a&&m<b);
const FLAG={'Colombia':'🇨🇴','Kenia':'🇰🇪','Argentina':'🇦🇷','México':'🇲🇽','Perú':'🇵🇪'};
V.contactar=()=>`<div class="pagehead"><div class="meta"><span class="eyebrow">Según respuestas por WhatsApp</span><h1>¿Es buena hora para escribirle al candidato?</h1></div><span class="muted small">Se actualiza sola</span></div>
  <div class="ctgrid" id="ctGrid"></div>
  <p class="muted small">Entre paréntesis: la misma hora en Colombia. Estimaciones con datos de respuesta de WhatsApp en Solvo Global.</p>`;
function renderCT(){
  if(!$('ctGrid'))return;
  const co=tzMin('America/Bogota');
  const rows=CT.map(c=>{const m=tzMin(c.tz);let off=m-co;if(off>720)off-=1440;if(off<-720)off+=1440;
    const good=inR(m,c.best),bad=inR(m,c.avoid);
    const nb=c.best.map(([a])=>a).sort((x,y)=>((x-m+1440)%1440)-((y-m+1440)%1440))[0],wait=(nb-m+1440)%1440;
    const cur=c.best.find(([a,b])=>m>=a&&m<b);
    const toCo=x=>hm(((x-off)%1440+1440)%1440);
    const rng=rs=>rs.map(([a,b])=>`${hm(a)} – ${hm(b)}`).join(L(' y ',' and '));
    const rngCo=rs=>rs.map(([a,b])=>`${toCo(a)} – ${toCo(b)}`).join(' y ');
    const w=`${wait>=60?Math.floor(wait/60)+' h':''}${wait%60?' '+wait%60+' min':''}`.trim();
    const st=good?['ok','✅ Sí, buen momento para escribir',`Quedan ${(()=>{const r=cur[1]-m;return `${r>=60?Math.floor(r/60)+' h ':''}${r%60?r%60+' min':''}`.trim()})()} de la mejor franja`]
      :bad?['no','⛔ Mejor no escribir ahora',`La mejor hora empieza en ${w} (${toCo(nb)} en Colombia)`]
      :['wait','⏳ Espera un poco',`La mejor hora empieza en ${w} (${toCo(nb)} en Colombia)`];
    return {c,m,off,good,st,html:`<article class="ct ${good?'good':''}"><div class="panel-head"><h2>${FLAG[c.p]||''} ${c.p}</h2><span class="muted small num">allá son las <b style="color:var(--ink)">${hm(m)}</b>${off?` · ${off>0?'+':''}${off/60} h`:''}</span></div>
      <div class="status ${st[0]}">${st[1]}<small>${st[2]}</small></div>
      <div class="ctl"><span class="k">Mejor hora</span><span>${rng(c.best)}${off?` <span class="co">(${rngCo(c.best)})</span>`:''}</span>
        ${c.avoid.length?`<span class="k">Evitar</span><span>${esc(c.at)}${c.tip&&/comida/.test(c.tip)?'':''}</span>`:''}
        ${c.tip?`<span class="k">Tip</span><span>${esc(c.tip)}</span>`:''}
        <span class="k">Responden</span><span><b>${c.rate}</b> de los candidatos</span></div>
    </article>`}});
  rows.sort((a,b)=>(b.good-a.good)||(a.st[0]==='no')-(b.st[0]==='no'));
  $('ctGrid').innerHTML=rows.map(r=>r.html).join('');
}

let ME=store.get('me','');
const bogotaMin=()=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Bogota',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());const h=+p.find(x=>x.type==='hour').value%24,m=+p.find(x=>x.type==='minute').value;return h*60+m};
const hm=m=>{const h=Math.floor(m/60),mi=m%60,ap=h<12?'am':'pm';return `${((h+11)%12)+1}${mi?':'+pad(mi):''}${ap}`};
V.horarios=()=>{

  ${[...DATA.horarios].sort((a,b)=>a.ini-b.ini).map(h=>`<tr${h.ta===ME?' style="font-weight:600"':''}><td>${esc(h.ta)}</td><td>${esc(h.cuenta)}</td><td class="num">${hm(h.ini)} – ${hm(h.fin)}</td></tr>`).join('')}</tbody></table></div></section>`;
